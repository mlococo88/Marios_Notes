<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LoCoNotes OneView</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>

try {

      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:wght@400;500;600&display=swap" rel="stylesheet">
<script>
tailwind.config={theme:{extend:{fontFamily:{sans:['IBM Plex Sans','system-ui','sans-serif'],mono:['IBM Plex Mono','monospace'],serif:['IBM Plex Serif','Georgia','serif']}}}}
</script>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body,#root{height:100%;margin:0;padding:0;overflow:hidden}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#0f1117;color:#e2e8f0;overscroll-behavior:none}
:root{
  --rail-w:52px;
  --accent:#2563eb;--accent-2:#3b82f6;--accent-glow:rgba(37,99,235,0.15);
  --success:#10b981;--warn:#f59e0b;--danger:#ef4444;
  /* The document "paper" stays light across themes so notes read like print. */
  --page-bg:#ffffff;
}
/* ── Dark (original) ───────────────────────────────────────────── */
:root,:root[data-theme="dark"]{
  --panel-bg:#0f1117;--sidebar-bg:#161b27;--surface:#1e2535;--surface-2:#252d40;
  --border:rgba(255,255,255,0.07);--border-2:rgba(255,255,255,0.12);
  --hover:rgba(255,255,255,0.06);
  --text-1:#f1f5f9;--text-2:#94a3b8;--text-3:#64748b;
  --canvas-bg:#d1d5db;
  --page-shadow:0 4px 32px rgba(0,0,0,0.4),0 1px 4px rgba(0,0,0,0.3);
}
/* ── Dim (softer slate, less harsh contrast) ──────────────────── */
:root[data-theme="dim"]{
  --panel-bg:#1c2230;--sidebar-bg:#222a3a;--surface:#2b3446;--surface-2:#354056;
  --border:rgba(255,255,255,0.09);--border-2:rgba(255,255,255,0.16);
  --hover:rgba(255,255,255,0.07);
  --text-1:#f3f6fb;--text-2:#aab6c8;--text-3:#7e8ba1;
  --canvas-bg:#aeb6c4;
  --page-shadow:0 4px 28px rgba(0,0,0,0.3),0 1px 4px rgba(0,0,0,0.2);
}
/* ── Light ─────────────────────────────────────────────────────── */
:root[data-theme="light"]{
  --panel-bg:#f1f3f7;--sidebar-bg:#e8ebf1;--surface:#dde2ea;--surface-2:#cfd6e1;
  --border:rgba(15,23,42,0.10);--border-2:rgba(15,23,42,0.18);
  --hover:rgba(15,23,42,0.05);
  --text-1:#1e293b;--text-2:#475569;--text-3:#64748b;
  --canvas-bg:#c4cbd6;
  --page-shadow:0 4px 24px rgba(15,23,42,0.12),0 1px 4px rgba(15,23,42,0.08);
}
.scr::-webkit-scrollbar{width:4px;height:4px}
.scr::-webkit-scrollbar-track{background:transparent}
.scr::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:2px}
.scr::-webkit-scrollbar-thumb:hover{background:var(--text-3)}
.rail{width:var(--rail-w);background:var(--panel-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:2px;flex-shrink:0;z-index:50}
.rail-logo{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:11px;color:white;letter-spacing:-0.5px;margin-bottom:6px;box-shadow:0 0 16px rgba(37,99,235,0.4);flex-shrink:0}
.rail-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--text-3);border-radius:8px;cursor:pointer;transition:all 0.15s;position:relative;border:none;background:transparent}
.rail-btn:hover{color:var(--text-1);background:var(--surface)}
.rail-btn.active{color:var(--accent-2);background:var(--accent-glow)}
.rail-btn .tooltip{position:absolute;left:calc(100% + 8px);background:var(--surface-2);color:var(--text-1);font-size:11px;padding:3px 8px;border-radius:4px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity 0.15s;border:1px solid var(--border-2);z-index:100}
.rail-btn:hover .tooltip{opacity:1}
.rail-divider{width:24px;height:1px;background:var(--border);margin:4px 0}
.rail-spacer{flex:1}
.panel{background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;position:relative;flex-shrink:0}
.panel-header{height:44px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--border);font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:0.06em;text-transform:uppercase;flex-shrink:0}
.panel-body{flex:1;overflow-y:auto;padding:6px}
.si{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--text-2);transition:all 0.12s;position:relative;user-select:none;min-height:32px}
.si:hover{background:var(--surface);color:var(--text-1)}
.si.active{background:var(--accent-glow);color:var(--accent-2);border:1px solid rgba(37,99,235,0.2)}
.si .si-actions{position:absolute;right:4px;display:none;gap:2px;align-items:center;background:var(--surface-2);border:1px solid var(--border-2);border-radius:5px;padding:2px 3px}
.si:hover .si-actions{display:flex}
.si-act-btn{width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:var(--text-3);border-radius:3px;background:transparent;border:none;cursor:pointer;transition:all 0.12s}
.si-act-btn:hover{color:var(--accent-2);background:var(--accent-glow)}
.si-act-btn.danger:hover{color:var(--danger);background:rgba(239,68,68,0.1)}
.si-label{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.si-date{font-size:10px;color:var(--text-3);flex-shrink:0}
.client-group-header{display:flex;align-items:center;gap:6px;padding:8px 8px 4px;font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-3);cursor:pointer;user-select:none;margin-top:8px}
.client-group-header:first-child{margin-top:0}
.client-group-header:hover{color:var(--text-2)}
.cg-actions{display:none;align-items:center;gap:1px;margin-left:auto;flex-shrink:0}
.client-group-header:hover .cg-actions{display:flex}
.cg-act-btn{background:none;border:none;color:var(--text-3);cursor:pointer;padding:2px;border-radius:3px;display:flex;align-items:center;justify-content:center}
.cg-act-btn:hover{background:var(--hover);color:var(--text-1)}
.cg-act-btn.cg-del:hover{color:#ef4444}
.resizer{position:absolute;right:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:20;display:flex;align-items:center;justify-content:center}
.resizer::after{content:'';display:block;width:2px;height:32px;background:var(--border-2);border-radius:1px;transition:all 0.15s}
.resizer:hover::after,.resizer.dragging::after{background:var(--accent);height:48px}
.editor-canvas{background:var(--canvas-bg);padding:24px;overflow-y:auto;flex:1}
.page-sheet{background:var(--page-bg);box-shadow:var(--page-shadow);margin:0 auto;padding:72px 80px;min-height:11in;width:8.5in;position:relative;border-radius:2px}
.page-title-input{width:100%;font-family:'IBM Plex Sans',sans-serif;font-size:28px;font-weight:600;color:#0f172a;border:none;outline:none;background:transparent;padding:0;margin:0 0 6px 0;line-height:1.2}
.page-meta{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#94a3b8;margin-bottom:24px;display:flex;gap:16px;flex-wrap:wrap}
.page-divider{border:none;border-top:1px solid #e2e8f0;margin-bottom:24px}
.rte{outline:none;font-family:'IBM Plex Serif',Georgia,serif;font-size:13.5px;color:#1e293b;line-height:1.7;min-height:200px;caret-color:var(--accent)}
.rte:empty::before{content:attr(data-placeholder);color:#cbd5e1}
.rte p{margin:0 0 0.6em 0}
.rte h1{font-family:'IBM Plex Sans',sans-serif;font-size:22px;font-weight:700;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:6px;margin:1.2em 0 0.5em}
.rte h2{font-family:'IBM Plex Sans',sans-serif;font-size:18px;font-weight:600;color:#1e293b;margin:1.1em 0 0.4em}
.rte h3{font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:600;color:#334155;margin:1em 0 0.35em}
.rte h4{font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:700;color:#475569;margin:0.9em 0 0.3em;text-transform:uppercase;letter-spacing:0.04em}
.rte ul{list-style:disc;padding-left:1.4em;margin:0.5em 0}
.rte ol{list-style:decimal;padding-left:1.4em;margin:0.5em 0}
.rte li{margin-bottom:0.2em}
.rte blockquote{border-left:3px solid var(--accent);padding:8px 12px;margin:1em 0;background:#f8fafc;color:#475569;font-style:italic;border-radius:0 4px 4px 0}
.rte table{width:100%;border-collapse:collapse;margin:1em 0;font-size:12.5px;font-family:'IBM Plex Sans',sans-serif}
.rte th{background:#f8fafc;font-weight:600;color:#334155;border:1px solid #cbd5e1;padding:7px 10px;text-align:left}
.rte td{border:1px solid #e2e8f0;padding:7px 10px;color:#1e293b}
.rte tr:nth-child(even) td{background:#fafafa}
.rte a{color:var(--accent);text-decoration:underline}
.rte code{font-family:'IBM Plex Mono',monospace;font-size:11.5px;background:#f1f5f9;padding:1px 5px;border-radius:3px;color:#e11d48}
.rte pre{background:#1e293b;color:#e2e8f0;padding:14px 16px;border-radius:6px;overflow-x:auto;font-family:'IBM Plex Mono',monospace;font-size:12px;margin:0.8em 0}
.rte img{max-width:100%;height:auto;border-radius:4px;margin:0.5em 0;border:1px solid #e2e8f0}
.eng-block{border-radius:6px;margin:1em 0;overflow:hidden;page-break-inside:avoid}
.eng-block-header{display:flex;align-items:center;gap:8px;padding:8px 12px;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase}
.eng-block-body{padding:12px 16px}
.calc-block{border:1px solid #bfdbfe;background:#eff6ff}
.calc-block .eng-block-header{background:#dbeafe;color:#1d4ed8;border-bottom:1px solid #bfdbfe}
.calc-label{color:#475569;min-width:160px;font-family:'IBM Plex Sans',sans-serif;font-size:12px}
.calc-formula{color:#1e40af;flex:1;font-style:italic}
.calc-result{color:#1e3a8a;font-weight:600;min-width:80px;text-align:right}
.calc-unit{color:#64748b;min-width:40px;font-size:11px}
.calc-ref{font-size:10px;color:#94a3b8;font-family:'IBM Plex Mono',monospace}
.callout-note{border:1px solid #bfdbfe;background:#eff6ff}
.callout-warn{border:1px solid #fde68a;background:#fffbeb}
.callout-alert{border:1px solid #fecaca;background:#fef2f2}
.callout-success{border:1px solid #a7f3d0;background:#ecfdf5}
.callout-note .eng-block-header{background:#dbeafe;color:#1d4ed8;border-bottom:1px solid #bfdbfe}
.callout-warn .eng-block-header{background:#fef3c7;color:#92400e;border-bottom:1px solid #fde68a}
.callout-alert .eng-block-header{background:#fee2e2;color:#991b1b;border-bottom:1px solid #fecaca}
.callout-success .eng-block-header{background:#d1fae5;color:#065f46;border-bottom:1px solid #a7f3d0}
.callout-body{font-size:13px;color:#334155;line-height:1.6}
.action-block{border:1px solid #e2e8f0;background:#fff}
.action-block .eng-block-header{background:#f8fafc;color:#475569;border-bottom:1px solid #e2e8f0}
.action-row{display:flex;align-items:flex-start;gap:10px;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:12.5px}
.action-row:last-child{border-bottom:none}
.action-check{width:16px;height:16px;border:1.5px solid #cbd5e1;border-radius:3px;flex-shrink:0;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
.action-check.done{background:var(--success);border-color:var(--success)}
.photo-block{border:1px solid #e2e8f0;background:#fff}
.photo-block .eng-block-header{background:#f8fafc;color:#475569;border-bottom:1px solid #e2e8f0}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.photo-item{border:1px solid #e2e8f0;border-radius:4px;overflow:hidden;background:#f8fafc}
.photo-item img{width:100%;height:120px;object-fit:cover;display:block}
.photo-caption{padding:6px 8px;font-size:11px;color:#475569;font-family:'IBM Plex Sans',sans-serif;border-top:1px solid #e2e8f0}
.photo-caption-stamp{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#94a3b8;display:block}
.sketch-tb-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:4px;cursor:pointer;border:1px solid #e2e8f0;background:white;color:#475569;transition:all 0.12s;font-size:11px}
.sketch-tb-btn:hover,.sketch-tb-btn.active{background:#eff6ff;border-color:#bfdbfe;color:var(--accent)}
.toolbar{display:flex;align-items:center;gap:2px;padding:5px 10px;background:#fff;border-bottom:1px solid #e2e8f0;flex-wrap:nowrap;overflow-x:auto;flex-shrink:0}
.toolbar::-webkit-scrollbar{height:2px}
.tb-sep{width:1px;height:18px;background:#e2e8f0;margin:0 4px;flex-shrink:0}
.tb-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#64748b;border-radius:4px;cursor:pointer;border:none;background:transparent;transition:all 0.12s;flex-shrink:0}
.tb-btn:hover{color:var(--accent);background:#eff6ff}
.tb-btn.active{color:var(--accent);background:#dbeafe}
.tb-select{font-size:11px;border:1px solid #e2e8f0;border-radius:4px;padding:2px 4px;outline:none;color:#475569;background:white;cursor:pointer;flex-shrink:0}
.tb-select:hover{border-color:var(--accent)}
.tb-label{font-size:11px;color:#94a3b8;padding:0 2px;white-space:nowrap;flex-shrink:0}
.popup-menu{position:fixed;z-index:200;background:white;border:1px solid #e2e8f0;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,0.15),0 2px 8px rgba(0,0,0,0.08);min-width:160px}
.popup-item{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:12.5px;color:#334155;cursor:pointer;border-radius:4px;margin:2px;transition:all 0.1s}
.popup-item:hover{background:#eff6ff;color:var(--accent)}
.popup-section{padding:6px 8px 3px;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#94a3b8}
.main-header{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--sidebar-bg);border-bottom:1px solid var(--border);flex-shrink:0}
.breadcrumb{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-3);overflow:hidden}
.breadcrumb-item{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.breadcrumb-item.current{color:var(--text-2)}
.ai-panel{display:flex;flex-direction:column;background:var(--sidebar-bg);border-left:1px solid var(--border);position:relative}
.ai-header{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.ai-msg{border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.55;max-width:90%}
.ai-msg.user{background:var(--accent);color:white;margin-left:auto}
.ai-msg.assistant{background:var(--surface);color:var(--text-1);border:1px solid var(--border-2)}
.ai-msg.assistant p{margin-bottom:0.5em}
.ai-msg.assistant p:last-child{margin-bottom:0}
.ai-msg.assistant ul{padding-left:1.2em;margin:0.3em 0}
.ai-msg.assistant li{margin-bottom:0.2em}
.ai-msg.assistant code{background:var(--surface-2);padding:1px 4px;border-radius:3px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#60a5fa}
.ai-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:100px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid var(--border-2);color:var(--text-2);background:var(--surface);transition:all 0.12s}
.ai-chip:hover{border-color:var(--accent-2);color:var(--accent-2)}
.dash-card{background:var(--surface);border:1px solid var(--border-2);border-radius:10px;padding:16px 20px}
.dash-stat{text-align:center}
.dash-stat .val{font-size:28px;font-weight:700;color:var(--accent-2);font-family:'IBM Plex Mono',monospace}
.dash-stat .lbl{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.06em;margin-top:2px}
.status-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:500}
.cal-day{min-height:80px;border:1px solid rgba(255,255,255,0.05);padding:4px;border-radius:4px;cursor:pointer;transition:background 0.12s;background:var(--surface)}
.cal-day:hover{background:var(--surface-2)}
.cal-day.today{border-color:var(--accent);background:var(--accent-glow)}
.cal-event{font-size:10px;padding:1px 5px;border-radius:3px;margin-bottom:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.bg-ruled{background-color:#fff;background-image:linear-gradient(0deg,transparent 95%,#e2e8f0 96%,#e2e8f0 100%);background-size:100% 28px}
.bg-grid{background-color:#fff;background-image:linear-gradient(#e8ecf0 1px,transparent 1px),linear-gradient(90deg,#e8ecf0 1px,transparent 1px);background-size:20px 20px}
.bg-dot{background-color:#fff;background-image:radial-gradient(#cbd5e1 1px,transparent 1px);background-size:20px 20px}
.bg-eng{background-color:#fefce8;background-image:linear-gradient(#bbf7d0 1px,transparent 1px),linear-gradient(90deg,#bbf7d0 1px,transparent 1px);background-size:20px 20px}
.bg-blueprint{background-color:#1e3a8a;background-image:linear-gradient(rgba(255,255,255,0.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.08) 1px,transparent 1px);background-size:20px 20px}
.bg-blueprint .rte{color:#e0f2fe}
.bg-blueprint .page-title-input{color:#e0f2fe}
.modal-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:24px}
.modal-box{background:var(--surface);border:1px solid var(--border-2);border-radius:12px;box-shadow:0 24px 80px rgba(0,0,0,0.5);max-height:90vh;display:flex;flex-direction:column}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-title{font-size:15px;font-weight:600;color:var(--text-1)}
.modal-body{flex:1;overflow-y:auto;padding:20px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}
.form-input{width:100%;padding:8px 10px;background:var(--panel-bg);border:1px solid var(--border-2);border-radius:6px;color:var(--text-1);font-size:13px;outline:none;font-family:'IBM Plex Sans',sans-serif;transition:border-color 0.15s}
.form-input:focus{border-color:var(--accent)}
.form-input::placeholder{color:var(--text-3)}
.form-label{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:0.06em;display:block;margin-bottom:5px}
.form-select{width:100%;padding:8px 10px;background:var(--panel-bg);border:1px solid var(--border-2);border-radius:6px;color:var(--text-1);font-size:13px;outline:none;cursor:pointer}
.form-select:focus{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all 0.15s;font-family:'IBM Plex Sans',sans-serif}
.btn-primary{background:var(--accent);color:white}
.btn-primary:hover{background:#1d4ed8}
.btn-ghost{background:transparent;color:var(--text-2);border:1px solid var(--border-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text-1)}
.btn-danger{background:rgba(239,68,68,0.1);color:var(--danger);border:1px solid rgba(239,68,68,0.2)}
.btn-danger:hover{background:rgba(239,68,68,0.2)}
.btn-sm{padding:5px 10px;font-size:12px}
kbd{display:inline-flex;align-items:center;padding:1px 5px;background:var(--surface-2);border:1px solid var(--border-2);border-radius:3px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-2)}
.search-overlay{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);display:flex;justify-content:center;padding-top:15vh}
.search-box{background:var(--surface);border:1px solid var(--border-2);border-radius:12px;width:100%;max-width:600px;max-height:70vh;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,0.6);overflow:hidden}
.search-result{padding:10px 16px;cursor:pointer;border-left:3px solid transparent;transition:all 0.1s}
.search-result:hover,.search-result.focused{background:var(--surface-2);border-left-color:var(--accent)}
.search-result-title{font-size:13px;color:var(--text-1);font-weight:500}
.search-result-path{font-size:11px;color:var(--text-3);font-family:'IBM Plex Mono',monospace}
.search-result-match{font-size:11.5px;color:var(--text-2);margin-top:2px}
mark{background:#fbbf24;color:#1e293b;border-radius:2px;padding:0 1px}
.split-resizer{width:6px;background:var(--border);cursor:col-resize;flex-shrink:0;transition:background 0.15s}
.split-resizer:hover,.split-resizer.dragging{background:var(--accent)}
canvas.pdf-page{box-shadow:0 4px 16px rgba(0,0,0,0.15);margin-bottom:16px;display:block}
.truncate{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.no-select{user-select:none}
.animate-spin{animation:spin 1s linear infinite}
.sync-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sync-dot.ok{background:var(--success)}
.sync-dot.saving{background:var(--warn);animation:pulse 1s infinite}
.sync-dot.error{background:var(--danger)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes fadeIn{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}

// ── IndexedDB ──────────────────────────────────────────────────────────────
const idb={
  _db:null,
  open(){
    if(this._db)return Promise.resolve(this._db);
    return new Promise((res,rej)=>{
      const req=indexedDB.open(DB_NAME,DB_VER);
      req.onupgradeneeded=(e)=>{
        const db=e.target.result;
        if(!db.objectStoreNames.contains('projects'))db.createObjectStore('projects',{keyPath:'id'});
        if(!db.objectStoreNames.contains('templates'))db.createObjectStore('templates',{keyPath:'id'});
        if(!db.objectStoreNames.contains('pageContent'))db.createObjectStore('pageContent',{keyPath:'id'});
        if(!db.objectStoreNames.contains('settings'))db.createObjectStore('settings',{keyPath:'key'});
      };
      req.onsuccess=(e)=>{this._db=e.target.result;res(this._db);};
      req.onerror=(e)=>rej(e.target.error);
    });
  },
  async tx(store,mode,fn){
    const db=await this.open();
    return new Promise((res,rej)=>{
      const tx=db.transaction(store,mode);
      const s=tx.objectStore(store);
      const req=fn(s);
      if(req&&req.onsuccess!==undefined){req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error);}
      else{tx.oncomplete=()=>res(null);tx.onerror=()=>rej(tx.error);}
    });
  },
  getAllProjects:()=>idb.tx('projects','readonly',s=>s.getAll()),
  putProject:(p)=>idb.tx('projects','readwrite',s=>s.put(p)),
  deleteProject:(id)=>idb.tx('projects','readwrite',s=>s.delete(id)),
  getAllTemplates:()=>idb.tx('templates','readonly',s=>s.getAll()),
  putTemplate:(t)=>idb.tx('templates','readwrite',s=>s.put(t)),
  deleteTemplate:(id)=>idb.tx('templates','readwrite',s=>s.delete(id)),
  getSetting:(k)=>idb.tx('settings','readonly',s=>s.get(k)),
  putSetting:(k,v)=>idb.tx('settings','readwrite',s=>s.put({key:k,value:v})),
};

// ── One-time migration from LoCoNotesDB (v1) to LoCoNotesV2 ───────────────
async function migrateFromV1(){
  const MIGRATED_KEY='lc_v1_migrated';
  if(localStorage.getItem(MIGRATED_KEY))return null;
  return new Promise((res)=>{
    const req=indexedDB.open('LoCoNotesDB',2);
    req.onerror=()=>res(null);
    req.onsuccess=(e)=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('projects')){db.close();res(null);return;}
      const tx=db.transaction('projects','readonly');
      const store=tx.objectStore('projects');
      const all=store.getAll();
      all.onsuccess=()=>{
        const data=all.result||[];
        db.close();
        if(data.length){
          console.log('[LoCoNotes] Migrating '+data.length+' projects from v1...');
          res(data);
        } else {
          res(null);
        }
      };
      all.onerror=()=>{db.close();res(null);};
    };
    req.onblocked=()=>res(null);
  }).then(async(data)=>{
    if(!data||!data.length){localStorage.setItem(MIGRATED_KEY,'1');return null;}
    await Promise.all(data.map(p=>idb.putProject(p)));
    localStorage.setItem(MIGRATED_KEY,'1');
    console.log('[LoCoNotes] Migration complete.');
    return data;
  }).catch(()=>null);
}

// ── Editor Engine ──────────────────────────────────────────────────────────
class EditorEngine{
  constructor(el){this.el=el;}
  saveSelection(){const sel=window.getSelection();if(!sel.rangeCount)return null;return sel.getRangeAt(0).cloneRange();}
  restoreSelection(r){if(!r)return;const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);}
  focus(){this.el&&this.el.focus();}
  exec(cmd,val=null){this.focus();try{document.execCommand(cmd,false,val);}catch(e){}}
  bold(){this.exec('bold');}italic(){this.exec('italic');}underline(){this.exec('underline');}
  strike(){this.exec('strikeThrough');}subscript(){this.exec('subscript');}superscript(){this.exec('superscript');}
  foreColor(c){this.exec('foreColor',c);}backColor(c){this.exec('hiliteColor',c);}
  removeFormat(){this.exec('removeFormat');}undo(){this.exec('undo');}redo(){this.exec('redo');}
  formatBlock(tag){this.focus();this.exec('formatBlock',tag);}
  fontName(f){this.exec('fontName',f);}fontSize(s){this.exec('fontSize',s);}
  justifyLeft(){this.exec('justifyLeft');}justifyCenter(){this.exec('justifyCenter');}justifyRight(){this.exec('justifyRight');}
  insertUL(){this.exec('insertUnorderedList');}insertOL(){this.exec('insertOrderedList');}
  indent(){this.exec('indent');}outdent(){this.exec('outdent');}
  insertHR(){this.exec('insertHorizontalRule');}
  insertLink(){const sel=window.getSelection();const u=prompt('URL:','https://');if(u){if(sel&&!sel.isCollapsed)this.exec('createLink',u);else this.exec('insertHTML','<a href="'+u+'" target="_blank">'+u+'</a>');}}
  insertImage(src){this.exec('insertImage',src);}
  insertHTML(html){this.focus();this.exec('insertHTML',html);}
  insertTable(rows=3,cols=3){
    let h='<table><thead><tr>';
    for(let c=0;c<cols;c++)h+='<th>Col '+(c+1)+'</th>';
    h+='</tr></thead><tbody>';
    for(let r=0;r<rows-1;r++){h+='<tr>';for(let c=0;c<cols;c++)h+='<td><br></td>';h+='</tr>';}
    h+='</tbody></table><p><br></p>';this.insertHTML(h);
  }
  _cell(){const sel=window.getSelection();if(!sel.rangeCount)return null;const a=sel.getRangeAt(0).commonAncestorContainer;return(a.nodeType===1?a:a.parentElement)?.closest('td,th');}
  addTableRow(){const c=this._cell();if(!c)return;const nr=c.parentElement.cloneNode(true);Array.from(nr.cells).forEach(x=>x.innerHTML='<br>');c.parentElement.after(nr);}
  addTableCol(){
    const c=this._cell();if(!c)return;const idx=c.cellIndex;const table=c.closest('table');
    Array.from(table.rows).forEach(r=>{const nc=document.createElement(r.parentNode.tagName==='THEAD'?'th':'td');nc.innerHTML=r.parentNode.tagName==='THEAD'?'Header':'<br>';if(r.cells[idx])r.cells[idx].after(nc);else r.appendChild(nc);});
  }
  deleteTable(){const c=this._cell();if(!c)return;c.closest('table').remove();}
}

  const dueCls=(due)=>{if(!due)return'';const d=new Date(due);if(d<now)return'color:#ef4444';if((d-now)<7*86400000)return'color:#f59e0b';return'color:#64748b';};

const SketchBlock=({block,onChange})=>{
  const cvRef=useRef(null);
  const[drawing,setDrawing]=useState(false);
  const[tool,setTool]=useState('pen');
  const[color,setColor]=useState('#1e293b');
  const[size,setSize]=useState(2);
  const lastPos=useRef(null);
  useEffect(()=>{const c=cvRef.current;if(!c)return;const ctx=c.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,c.width,c.height);if(block.imageData){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0);img.src=block.imageData;}},[]);
  const getPos=(e,c)=>{const r=c.getBoundingClientRect(),sx=c.width/r.width,sy=c.height/r.height;if(e.touches)return{x:(e.touches[0].clientX-r.left)*sx,y:(e.touches[0].clientY-r.top)*sy};return{x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy};};
  const start=(e)=>{e.preventDefault();setDrawing(true);lastPos.current=getPos(e,cvRef.current);};
  const draw=(e)=>{e.preventDefault();if(!drawing)return;const c=cvRef.current,ctx=c.getContext('2d'),pos=getPos(e,c);ctx.beginPath();ctx.moveTo(lastPos.current.x,lastPos.current.y);ctx.lineTo(pos.x,pos.y);ctx.strokeStyle=tool==='eraser'?'#ffffff':color;ctx.lineWidth=tool==='eraser'?size*4:size;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();lastPos.current=pos;};
  const stop=()=>{if(!drawing)return;setDrawing(false);onChange&&onChange({...block,imageData:cvRef.current.toDataURL()});};
  const clear=()=>{const c=cvRef.current,ctx=c.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,c.width,c.height);onChange&&onChange({...block,imageData:null});};
  return(
    <div className="eng-block" style={{border:'1px solid #e2e8f0',background:'#fff',borderRadius:'6px',overflow:'hidden'}}>
      <div className="eng-block-header" style={{background:'#f8fafc',color:'#475569',borderBottom:'1px solid #e2e8f0'}}>
        <span>✏</span><span>{block.title||'Sketch'}</span>
        <div style={{marginLeft:'auto',display:'flex',gap:'4px',alignItems:'center'}}>
          {[['pen','✏'],['eraser','⬜']].map(([id,icon])=>(
            <button key={id} onClick={()=>setTool(id)} className={'sketch-tb-btn'+(tool===id?' active':'')}>{icon}</button>
          ))}
          <input type="color" value={color} onChange={e=>setColor(e.target.value)} style={{width:'24px',height:'24px',border:'1px solid #e2e8f0',borderRadius:'4px',cursor:'pointer',padding:0}}/>
          <select value={size} onChange={e=>setSize(Number(e.target.value))} className="tb-select" style={{width:'50px',fontSize:'11px'}}>
            {[1,2,3,5,8].map(s=><option key={s} value={s}>{s}px</option>)}
          </select>
          <button onClick={clear} className="sketch-tb-btn" style={{width:'auto',padding:'0 6px',fontSize:'10px'}}>Clear</button>
        </div>
      </div>
      <canvas ref={cvRef} width={700} height={380} style={{width:'100%',height:'auto',display:'block',cursor:tool==='eraser'?'cell':'crosshair',touchAction:'none'}}
        onMouseDown={start} onMouseMove={draw} onMouseUp={stop} onMouseLeave={stop}
        onTouchStart={start} onTouchMove={draw} onTouchEnd={stop}/>
    </div>
  );
};

// ── Rich Text Editor ────────────────────────────────────────────────────────
// Key insight: this component must be keyed by page.id at the call site.
// On mount it loads initial content once. After that, the DOM is the
// source of truth and onChange propagates changes up. We never write
// back to innerHTML after mount to avoid cursor/race conflicts.
const RichEditor=React.forwardRef(({content,onChange,engineRef,placeholder='Start writing...'},ref)=>{
  const elRef=useRef(null);
  const engineInst=useRef(null);
  const onChangeRef=useRef(onChange);
  onChangeRef.current=onChange; // keep current without re-registering events

  // Mount: load initial content and set up engine
  useEffect(()=>{
    if(!elRef.current)return;
    // Set initial content once on mount
    elRef.current.innerHTML=content||'';
    // Set up editor engine
    engineInst.current=new EditorEngine(elRef.current);
    if(engineRef)engineRef.current=engineInst.current;
    // Focus
    elRef.current.focus();
    // Place cursor at end
    try{
      const range=document.createRange();
      const sel=window.getSelection();
      range.selectNodeContents(elRef.current);
      range.collapse(false);
      sel.removeAllRanges();
      sel.addRange(range);
    }catch(e){}
    // Cleanup: clear engine ref on unmount
    return function(){
      if(engineRef)engineRef.current=null;
      engineInst.current=null;
    };
  },[]); // empty deps - only runs on mount/unmount

  React.useImperativeHandle(ref,()=>elRef.current);

  const handleKeyDown=(e)=>{
    if(e.key==='Tab'){e.preventDefault();engineInst.current?.exec(e.shiftKey?'outdent':'indent');}
    if((e.ctrlKey||e.metaKey)&&e.key==='b'){e.preventDefault();engineInst.current?.bold();}
    if((e.ctrlKey||e.metaKey)&&e.key==='i'){e.preventDefault();engineInst.current?.italic();}
    if((e.ctrlKey||e.metaKey)&&e.key==='u'){e.preventDefault();engineInst.current?.underline();}
    if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();engineInst.current?.undo();}
    if((e.ctrlKey||e.metaKey)&&e.key==='y'){e.preventDefault();engineInst.current?.redo();}
  };

  return(
    <div ref={elRef} className="rte" contentEditable suppressContentEditableWarning
      data-placeholder={placeholder}
      onInput={e=>onChangeRef.current(e.currentTarget.innerHTML)}
      onKeyDown={handleKeyDown}
      style={{minHeight:'400px'}}/>
  );
});

// ── Eng Blocks Section ──────────────────────────────────────────────────────
const EngBlocksSection=({blocks,onChange})=>{
  const upd=(id,d)=>onChange(blocks.map(b=>b.id===id?{...b,...d}:b));
  const remove=(id)=>{if(confirm('Remove this block?'))onChange(blocks.filter(b=>b.id!==id));};
  const move=(id,dir)=>{const i=blocks.findIndex(b=>b.id===id);if((dir===-1&&i===0)||(dir===1&&i===blocks.length-1))return;const nb=[...blocks];[nb[i],nb[i+dir]]=[nb[i+dir],nb[i]];onChange(nb);};
  const render=(block)=>{
    const p={key:block.id,block,onChange:(d)=>upd(block.id,d)};
    switch(block.type){
      case'calc':return<CalcBlock {...p}/>;
      case'note':return<CalloutBlock {...p} type="note"/>;
      case'warn':return<CalloutBlock {...p} type="warn"/>;
      case'alert':return<CalloutBlock {...p} type="alert"/>;
      case'success':return<CalloutBlock {...p} type="success"/>;
      case'action':return<ActionBlock {...p}/>;
      case'photo':return<PhotoBlock {...p}/>;
      case'sketch':return<SketchBlock {...p}/>;
      case'rfi':return<RfiBlock {...p}/>;
      default:return null;
    }
  };
  if(!blocks.length)return null;
  return(
    <div style={{marginTop:'24px',borderTop:'1px solid #e2e8f0',paddingTop:'24px'}}>
      <div style={{fontSize:'10px',color:'#94a3b8',textTransform:'uppercase',letterSpacing:'0.1em',fontFamily:'IBM Plex Mono',marginBottom:'12px'}}>Engineering Blocks</div>
      {blocks.map((block,i)=>(
        <div key={block.id} style={{position:'relative',marginBottom:'16px'}}
          onMouseEnter={e=>e.currentTarget.querySelector('.bc').style.opacity=1}
          onMouseLeave={e=>e.currentTarget.querySelector('.bc').style.opacity=0}>
          {render(block)}
          <div className="bc" style={{position:'absolute',top:'6px',right:'6px',display:'flex',gap:'2px',opacity:0,transition:'opacity 0.15s'}}>
            <button onClick={()=>move(block.id,-1)} style={{background:'white',border:'1px solid #e2e8f0',borderRadius:'3px',width:'20px',height:'20px',cursor:'pointer',fontSize:'11px',color:'#475569'}}>↑</button>
            <button onClick={()=>move(block.id,1)} style={{background:'white',border:'1px solid #e2e8f0',borderRadius:'3px',width:'20px',height:'20px',cursor:'pointer',fontSize:'11px',color:'#475569'}}>↓</button>
            <button onClick={()=>remove(block.id)} style={{background:'white',border:'1px solid #fecaca',borderRadius:'3px',width:'20px',height:'20px',cursor:'pointer',fontSize:'11px',color:'#ef4444'}}>×</button>
          </div>
        </div>
      ))}
    </div>
  );
};

// ── PDF Viewer ─────────────────────────────────────────────────────────────
const PdfViewer=memo(({pageData})=>{
  const cvRef=useRef(null);const[doc,setDoc]=useState(null);const[page,setPage]=useState(1);const[scale,setScale]=useState(1.3);
  useEffect(()=>{
    if(!pageData?.pdfData||typeof pdfjsLib==='undefined')return;
    try{
      pdfjsLib.getDocument({data:atob(pageData.pdfData.split(',')[1]||'')}).promise
        .then(function(d){setDoc(d);setPage(1);})
        .catch(function(e){console.warn('PDF load error:',e);});
    }catch(e){
      // Fallback: try passing data URL directly
      pdfjsLib.getDocument(pageData.pdfData).promise
        .then(function(d){setDoc(d);setPage(1);})
        .catch(function(e2){console.warn('PDF fallback error:',e2);});
    }
  },[pageData]);
  useEffect(()=>{if(!doc||!cvRef.current)return;doc.getPage(page).then(p=>{const vp=p.getViewport({scale});const ctx=cvRef.current.getContext('2d');cvRef.current.height=vp.height;cvRef.current.width=vp.width;p.render({canvasContext:ctx,viewport:vp});});},[doc,page,scale]);
  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',background:'#e2e8f0',padding:'16px',overflowY:'auto',flex:1}} className="scr">
      <div style={{display:'flex',gap:'8px',alignItems:'center',background:'white',padding:'8px 14px',borderRadius:'8px',boxShadow:'0 2px 8px rgba(0,0,0,0.1)',marginBottom:'16px',position:'sticky',top:0,zIndex:5}}>
        <button onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={page<=1} style={{padding:'4px 10px',border:'1px solid #e2e8f0',borderRadius:'4px',cursor:'pointer',fontSize:'12px',background:page<=1?'#f8fafc':'white'}}>← Prev</button>
        <span style={{fontSize:'12px',color:'#475569',fontFamily:'IBM Plex Mono',minWidth:'80px',textAlign:'center'}}>Page {page}/{doc?.numPages||'–'}</span>
        <button onClick={()=>setPage(p=>Math.min(doc?.numPages||1,p+1))} disabled={page>=(doc?.numPages||1)} style={{padding:'4px 10px',border:'1px solid #e2e8f0',borderRadius:'4px',cursor:'pointer',fontSize:'12px',background:page>=(doc?.numPages||1)?'#f8fafc':'white'}}>Next →</button>
        <div style={{width:'1px',height:'16px',background:'#e2e8f0',margin:'0 4px'}}/>
        <button onClick={()=>setScale(s=>Math.max(0.5,s-0.2))} style={{padding:'4px 8px',border:'1px solid #e2e8f0',borderRadius:'4px',cursor:'pointer'}}>−</button>
        <span style={{fontSize:'11px',color:'#94a3b8',fontFamily:'IBM Plex Mono',minWidth:'36px',textAlign:'center'}}>{Math.round(scale*100)}%</span>
        <button onClick={()=>setScale(s=>Math.min(3,s+0.2))} style={{padding:'4px 8px',border:'1px solid #e2e8f0',borderRadius:'4px',cursor:'pointer'}}>+</button>
      </div>
      <canvas ref={cvRef} className="pdf-page"/>
    </div>
  );
});

// ── Project Calendar ───────────────────────────────────────────────────────
const ProjectCalendar=({project,onUpdate})=>{ // 'project' may be a project OR a notebook node
  const[cur,setCur]=useState(new Date());
  const[modal,setModal]=useState(null);
  const[newEv,setNewEv]=useState({title:'',type:'Deliverable'});
  const events=project.events||[];
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const today=new Date();
  const todayStr=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  const ymd=(y,m,d)=>y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  const dim=(d)=>new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  const fd=(d)=>new Date(d.getFullYear(),d.getMonth(),1).getDay();
  const tc={Deliverable:{bg:'rgba(239,68,68,0.15)',color:'#dc2626'},'Field Visit':{bg:'rgba(16,185,129,0.15)',color:'#10b981'},QC:{bg:'rgba(245,158,11,0.15)',color:'#f59e0b'},Meeting:{bg:'rgba(37,99,235,0.15)',color:'#3b82f6'},Other:{bg:'rgba(100,116,139,0.15)',color:'#94a3b8'}};
  const addEvent=()=>{if(!newEv.title||!modal)return;onUpdate(project.id,{...project.metadata},[...events,{...newEv,id:Date.now(),date:modal}]);setModal(null);setNewEv({title:'',type:'Deliverable'});};
  const delEvent=(id)=>{if(confirm('Delete event?'))onUpdate(project.id,{...project.metadata},events.filter(e=>e.id!==id));};
  const blanks=Array(fd(cur)).fill(null);
  const days=Array.from({length:dim(cur)},(_,i)=>i+1);
  return(
    <div style={{flex:1,overflowY:'auto',padding:'24px'}} className="scr">
      <div className="dash-card" style={{maxWidth:'900px',margin:'0 auto'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'20px',paddingBottom:'16px',borderBottom:'1px solid var(--border)'}}>
          <span style={{fontSize:'15px',fontWeight:600,color:'var(--text-1)'}}>Project Schedule</span>
          <div style={{display:'flex',alignItems:'center',gap:'12px'}}>
            <button onClick={()=>setCur(new Date(cur.getFullYear(),cur.getMonth()-1,1))} style={{background:'none',border:'none',color:'var(--text-2)',cursor:'pointer'}}><I name="ChevL" size={18}/></button>
            <span style={{fontSize:'14px',fontWeight:600,color:'var(--text-1)',minWidth:'160px',textAlign:'center'}}>{months[cur.getMonth()]} {cur.getFullYear()}</span>
            <button onClick={()=>setCur(new Date(cur.getFullYear(),cur.getMonth()+1,1))} style={{background:'none',border:'none',color:'var(--text-2)',cursor:'pointer'}}><I name="ChevR" size={18}/></button>
          </div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'4px'}}>
          {['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>(
            <div key={d} style={{textAlign:'center',fontSize:'10px',fontWeight:700,color:'var(--text-3)',padding:'6px 0',textTransform:'uppercase',letterSpacing:'0.06em'}}>{d}</div>
          ))}
          {[...blanks,...days].map((day,i)=>{
            if(!day)return<div key={'b'+i}/>;
            const ds=ymd(cur.getFullYear(),cur.getMonth(),day);
            const dayEvs=events.filter(e=>e.date===ds);
            const isToday=ds===todayStr;
            return(
              <div key={day} className={'cal-day'+(isToday?' today':'')} onClick={()=>setModal(ds)}>
                <div style={{fontSize:'11px',fontWeight:isToday?700:400,color:isToday?'var(--accent-2)':'var(--text-2)',marginBottom:'3px'}}>{day}</div>
                {dayEvs.map(ev=>(
                  <div key={ev.id} className="cal-event" style={{background:tc[ev.type]?.bg||tc.Other.bg,color:tc[ev.type]?.color||tc.Other.color}}
                    onClick={e=>{e.stopPropagation();delEvent(ev.id);}} title={ev.title+' (click to delete)'}>{ev.title}</div>
                ))}
              </div>
            );
          })}
        </div>
        <div style={{display:'flex',flexWrap:'wrap',gap:'8px',marginTop:'16px',paddingTop:'12px',borderTop:'1px solid var(--border)'}}>
          {Object.entries(tc).map(([k,v])=>(
            <span key={k} style={{display:'inline-flex',alignItems:'center',gap:'4px',fontSize:'10px',color:v.color}}>
              <span style={{width:'8px',height:'8px',borderRadius:'50%',background:v.bg,border:'1px solid '+v.color,display:'inline-block'}}/>{k}
            </span>
          ))}
        </div>
      </div>
      {modal&&(
        <div className="modal-overlay" onClick={()=>setModal(null)}>
          <div className="modal-box" style={{width:'340px'}} onClick={e=>e.stopPropagation()}>
            <div className="modal-header"><span className="modal-title">Add Event — {modal}</span><button className="rail-btn" onClick={()=>setModal(null)}><I name="X" size={14}/></button></div>
            <div className="modal-body" style={{display:'flex',flexDirection:'column',gap:'12px'}}>
              <div><label className="form-label">Event Title</label><input autoFocus className="form-input" value={newEv.title} onChange={e=>setNewEv({...newEv,title:e.target.value})} onKeyDown={e=>e.key==='Enter'&&addEvent()} placeholder="Milestone or event description..."/></div>
              <div><label className="form-label">Type</label>
                <select className="form-select" value={newEv.type} onChange={e=>setNewEv({...newEv,type:e.target.value})}>
                  {Object.keys(tc).map(t=><option key={t} value={t}>{t}</option>)}
                </select>
              </div>
            </div>
            <div className="modal-footer"><button className="btn btn-ghost btn-sm" onClick={()=>setModal(null)}>Cancel</button><button className="btn btn-primary btn-sm" onClick={addEvent}>Add Event</button></div>
          </div>
        </div>
      )}
    </div>
  );
};

        <div style={{padding:'8px 16px',borderTop:'1px solid var(--border)',display:'flex',gap:'12px',fontSize:'10px',color:'var(--text-3)'}}>
          <span><kbd>↑↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>ESC</kbd> close</span>

    </div>
  );

// ── Dynamic Gemini model resolution ─────────────────────────────────────────
// Rather than relying on a single hardcoded model string (which fails when
// Google rotates preview builds out of service), this resolver discovers the
// models the API key can actually access and selects a working one, retrying
// down a priority list if the first choice is rejected.

// Module-level cache so we only query the model list once per session.
var _lcModelCache = { list: null, fetchedAt: 0 };

// Priority order: stable identifiers first, newest generation first within tier.
// Flash tier is preferred as the default (cost/latency); Pro tiers are fallbacks.
var GEMINI_MODEL_PRIORITY = [
  'gemini-2.5-flash',
  'gemini-flash-latest',
  'gemini-2.5-flash-lite',
  'gemini-2.0-flash',
  'gemini-2.5-pro',
  'gemini-pro-latest',
  'gemini-1.5-flash',
  'gemini-1.5-pro'
];

// Query the API for the list of models this key supports for generateContent.
async function fetchAvailableModels(apiKey){
  // Reuse cached list for 10 minutes to avoid repeated discovery calls.
  if(_lcModelCache.list && (Date.now() - _lcModelCache.fetchedAt) < 600000){
    return _lcModelCache.list;
  }
  try{
    const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models?key=' + apiKey);
    const data = await res.json();
    if(data.error) throw new Error(data.error.message);
    const models = (data.models || [])
      .filter(function(m){
        return m.supportedGenerationMethods &&
               m.supportedGenerationMethods.indexOf('generateContent') !== -1;
      })
      .map(function(m){
        // API returns names like 'models/gemini-2.5-flash'; strip the prefix.
        return m.name.replace(/^models\//, '');
      });
    _lcModelCache.list = models;
    _lcModelCache.fetchedAt = Date.now();
    return models;
  }catch(e){
    // If discovery fails (network, key), return empty so caller falls back
    // to the static priority list.
    return [];
  }
}

// Given the available models, pick the best one: honor the user's explicit
// preference if it's still valid, otherwise walk the priority list, otherwise
// take the first available model the key reports.
function chooseModel(available, preferred){
  if(preferred && preferred !== 'auto' && available.indexOf(preferred) !== -1) return preferred;
  for(var i=0;i<GEMINI_MODEL_PRIORITY.length;i++){
    if(available.indexOf(GEMINI_MODEL_PRIORITY[i]) !== -1) return GEMINI_MODEL_PRIORITY[i];
  }
  return available.length ? available[0] : null;
}

// One generateContent attempt against a specific model.
async function attemptGenerate(apiKey, model, promptText){
  const res = await fetch(
    'https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + apiKey,
    {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:promptText}]}]})
    }
  );
  const data = await res.json();
  if(data.error){
    const err = new Error(data.error.message);
    err.status = data.error.code;
    err.modelRelated = /not found|not supported|does not exist|deprecated/i.test(data.error.message || '');
    throw err;
  }
  return data.candidates && data.candidates[0] && data.candidates[0].content &&
         data.candidates[0].content.parts && data.candidates[0].content.parts[0] &&
         data.candidates[0].content.parts[0].text || 'No response received.';
}

// Main entry point: resolve a working model and generate, retrying down the
// list if a model is rejected as unavailable. Persists the discovered working
// model back into settings so subsequent calls go straight to it.
async function callGeminiWithFallback(settings, promptText){
  if(!settings.apiKey) throw new Error('No API key configured.');

  // Discover what this key can use.
  const available = await fetchAvailableModels(settings.apiKey);

  // Build an ordered candidate list to try.
  var candidates = [];
  const chosen = chooseModel(available, settings.model);
  if(chosen) candidates.push(chosen);
  // Append the rest of the priority list (and the discovered list) as fallbacks,
  // de-duplicated, so a rejection of the first choice cascades intelligently.
  GEMINI_MODEL_PRIORITY.forEach(function(m){ if(candidates.indexOf(m) === -1) candidates.push(m); });
  available.forEach(function(m){ if(candidates.indexOf(m) === -1) candidates.push(m); });
  // If discovery returned nothing and there's a real user preference, ensure it's tried.
  if(settings.model && settings.model !== 'auto' && candidates.indexOf(settings.model) === -1) candidates.unshift(settings.model);

  var lastErr = null;
  for(var i=0;i<candidates.length;i++){
    var model = candidates[i];
    try{
      const text = await attemptGenerate(settings.apiKey, model, promptText);
      // Success — remember this model for next time if it changed.
      if(window._lcOnModelResolved && model !== settings.model){
        window._lcOnModelResolved(model);
      }
      return text;
    }catch(e){
      lastErr = e;
      // Only continue to the next candidate if the failure is model-related.
      // Auth errors, quota errors, and malformed-request errors should stop
      // immediately — retrying other models won't help and wastes quota.
      if(!e.modelRelated) throw e;
      // otherwise loop to the next candidate
    }
  }
  throw new Error(
    (lastErr ? lastErr.message + ' — ' : '') +
    'No compatible Gemini model could be found for this API key. ' +
    'Open https://generativelanguage.googleapis.com/v1beta/models?key=YOUR_KEY to see available models.'
  );
}

// ── AI Panel ───────────────────────────────────────────────────────────────
const AIPanel=({projects,selectedProjId,selectedNoteId,selectedPageId,settings,onClose,width,onResizeStart})=>{
  const[messages,setMessages]=useState([{id:'1',role:'assistant',content:'Hello! I can analyze your project notes, generate structured summaries, extract action items, and draft deliverables. Select a context scope and ask me anything, or tap a quick prompt below.'}]);
  const[input,setInput]=useState('');
  const[loading,setLoading]=useState(false);
  const[scope,setScope]=useState('project');
  const[includePdfs,setIncludePdfs]=useState(false);
  const endRef=useRef(null);
  useEffect(()=>{endRef.current?.scrollIntoView({behavior:'smooth'});},[messages]);
  const clean=(html)=>html?html.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim():'';
  const buildContext=()=>{
    let ctx='';
    const proj=projects.find(p=>p.id===selectedProjId);
    // Task (notebook) metadata is the record of substance; include the tasks in scope.
    if(proj&&(scope==='notebook'||scope==='project'||scope==='all')){
      const nbs=(proj.children||[]).filter(function(n){
        if(scope==='notebook')return n.id===selectedNoteId;
        return true; // project/all scope: include every task in the project
      });
      const withMeta=nbs.filter(function(n){return n.metadata&&Object.keys(n.metadata).length;});
      if(withMeta.length){
        ctx+='PROJECT: '+proj.title+'\n';
        withMeta.forEach(function(n){
          const m=n.metadata||{};
          ctx+='TASK: '+n.title+'\n';
          ctx+='  Client: '+(m.client||'N/A')+' | PM: '+(m.manager||'N/A')+' | Status: '+(m.status||'N/A')+' | Fee: $'+(m.fee||'N/A')+'\n';
          if(m.projectNumber)ctx+='  Project No: '+m.projectNumber+'\n';
          if(m.dueDate)ctx+='  Due: '+m.dueDate+'\n';
          if(m.notes)ctx+='  Notes: '+m.notes+'\n';
          (m.customFields||[]).forEach(function(f){ctx+='  '+f.label+': '+f.value+'\n';});
        });
        ctx+='\n';
      }
    }
    projects.forEach(p=>(p.children||[]).forEach(n=>(n.children||[]).forEach(pg=>{
      const inScope=(scope==='page'&&pg.id===selectedPageId)||(scope==='notebook'&&n.id===selectedNoteId)||(scope==='project'&&p.id===selectedProjId)||(scope==='all');
      if(!inScope)return;
      const isPdf=pg.mimeType==='application/pdf';
      const text=isPdf?(includePdfs?pg.extractedText||'[PDF - no text extracted]':'[PDF omitted]'):clean(pg.content||'');
      if(text&&text!=='[PDF omitted]'&&ctx.length<30000){
        const t=text.length>6000?text.slice(0,6000)+'...[truncated]':text;
        ctx+='=== '+p.title+' › '+n.title+' › '+pg.title+' ===\n'+t+'\n\n';
      }
    })));
    return ctx;
  };
  const send=async(msg)=>{
    if(!msg?.trim())return;
    if(!settings.apiKey){alert('Please enter a Gemini API key in Settings (gear icon).');return;}
    const userMsg={id:Date.now().toString(),role:'user',content:msg};
    setMessages(prev=>[...prev,userMsg]);setInput('');setLoading(true);
    const context=buildContext();
    const systemPrompt='You are an expert assistant for structural engineers and infrastructure project managers. Help analyze field notes, meeting minutes, engineering calculations, and project documentation.\n\nContext from user notes:\n'+context+'\n\nInstructions:\n- Provide structured, professional responses appropriate for engineering practice\n- When listing action items use numbered format with assignee and due date where known\n- When generating summaries use clear section headings\n- Reference specific page names when citing information\n- Use markdown formatting for reports and tables';
    try{
      const text=await callGeminiWithFallback(settings,systemPrompt+'\n\nUser: '+msg);
      setMessages(prev=>[...prev,{id:Date.now().toString(),role:'assistant',content:text}]);

// ── Settings Modal ─────────────────────────────────────────────────────────
// ── OneNote/Word .docx notebook importer ─────────────────────────────────────
// OneNote exports an entire notebook as a single .docx where each page title is
// rendered at 20pt (sz=40 half-points) and immediately followed by a weekday date
// line. We parse word/document.xml directly to recover those page boundaries,
// since the titles carry no semantic heading style (they use direct formatting).

// Minimal in-browser unzip for a single stored/deflated entry from a .docx (ZIP).
// Uses the native DecompressionStream API (available in modern Chrome).
async function extractDocxEntry(arrayBuffer, entryName){
  const dv=new DataView(arrayBuffer);
  const bytes=new Uint8Array(arrayBuffer);
  // Find End Of Central Directory record (signature 0x06054b50), scanning from end.
  let eocd=-1;
  for(let i=bytes.length-22;i>=0;i--){
    if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}
  }
  if(eocd<0)throw new Error('Not a valid .docx (no ZIP directory found).');
  const cdOffset=dv.getUint32(eocd+16,true);
  const cdCount=dv.getUint16(eocd+10,true);
  let p=cdOffset;
  const dec=new TextDecoder('utf-8');
  for(let c=0;c<cdCount;c++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true);
    const compSize=dv.getUint32(p+20,true);
    const nameLen=dv.getUint16(p+28,true);
    const extraLen=dv.getUint16(p+30,true);
    const commentLen=dv.getUint16(p+32,true);
    const localOffset=dv.getUint32(p+42,true);
    const name=dec.decode(bytes.subarray(p+46,p+46+nameLen));
    if(name===entryName){
      // Read local header to find actual data start.
      const lNameLen=dv.getUint16(localOffset+26,true);
      const lExtraLen=dv.getUint16(localOffset+28,true);
      const dataStart=localOffset+30+lNameLen+lExtraLen;
      const comp=bytes.subarray(dataStart,dataStart+compSize);
      if(method===0){ // stored
        return dec.decode(comp);
      } else if(method===8){ // deflate
        const ds=new DecompressionStream('deflate-raw');
        const stream=new Blob([comp]).stream().pipeThrough(ds);
        const buf=await new Response(stream).arrayBuffer();
        return dec.decode(new Uint8Array(buf));
      } else {
        throw new Error('Unsupported ZIP compression method: '+method);
      }
    }
    p+=46+nameLen+extraLen+commentLen;
  }
  throw new Error('Entry not found in .docx: '+entryName);
}

function _docxParaText(p){
  const runs=p.match(/<w:t[^>]*>([\s\S]*?)<\/w:t>/g)||[];
  let t=runs.map(function(r){return r.replace(/<[^>]+>/g,'');}).join('');
  // unescape XML entities
  t=t.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#x27;/g,"'").replace(/&#xa;/g,' ').replace(/&apos;/g,"'");
  return t.trim();
}
function _docxMaxSize(p){
  const m=p.match(/<w:sz w:val="(\d+)"/g)||[];
  let mx=0;
  m.forEach(function(s){const v=parseInt(s.replace(/\D/g,''),10);if(v>mx)mx=v;});
  return mx||null;
}
function _docxRunsHtml(p){
  const runs=p.match(/<w:r\b[^>]*>[\s\S]*?<\/w:r>/g)||[];
  let out='';
  runs.forEach(function(r){
    const tm=r.match(/<w:t[^>]*>([\s\S]*?)<\/w:t>/g)||[];
    let txt=tm.map(function(x){return x.replace(/<[^>]+>/g,'');}).join('');
    if(!txt)return;
    txt=txt.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#x27;/g,"'").replace(/&apos;/g,"'").replace(/&#xa;/g,' ');
    // re-escape for safe HTML
    txt=txt.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const bold=/<w:b\/>|<w:b /.test(r);
    const ital=/<w:i\/>|<w:i /.test(r);
    if(bold)txt='<strong>'+txt+'</strong>';
    if(ital)txt='<em>'+txt+'</em>';
    out+=txt;
  });
  return out;
}

var _DOCX_DATE_RE=/^(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday),\s+\w+\s+\d{1,2},\s+\d{4}/i;

// Parse the document XML into an array of {title, html} pages.
function parseDocxNotebook(xml){
  const bodyMatch=xml.match(/<w:body>([\s\S]*)<\/w:body>/);
  const body=bodyMatch?bodyMatch[1]:xml;
  const paras=body.match(/<w:p\b[^>]*>[\s\S]*?<\/w:p>/g)||[];

  function nextText(idx){
    for(let j=idx+1;j<Math.min(idx+3,paras.length);j++){
      const t=_docxParaText(paras[j]);
      if(t)return t;
    }
    return '';
  }
  // Find page-break indices: 20pt paragraph followed by a weekday date line.
  const breaks=[];
  for(let i=0;i<paras.length;i++){
    if(_docxMaxSize(paras[i])===40 && _DOCX_DATE_RE.test(nextText(i))){
      breaks.push(i);
    }
  }
  if(!breaks.length){
    // Fallback: no detectable page titles - treat whole doc as one page.
    let h='';
    paras.forEach(function(p){
      const seg=_docxRunsHtml(p);
      if(seg.trim())h+='<p>'+seg+'</p>';
    });
    return [{title:'Imported Page',html:h}];
  }
  breaks.push(paras.length);
  const pages=[];
  for(let b=0;b<breaks.length-1;b++){
    const start=breaks[b],end=breaks[b+1];
    const title=_docxParaText(paras[start])||('Page '+(b+1));
    let h='';
    for(let k=start+1;k<end;k++){
      const p=paras[k];
      const seg=_docxRunsHtml(p);
      if(!seg.trim())continue;
      const sz=_docxMaxSize(p);
      const isList=/<w:numPr>/.test(p);
      if(isList){
        h+='<li>'+seg+'</li>';
      } else if(sz===36||sz===32){
        h+='<h2>'+seg+'</h2>';
      } else {
        h+='<p>'+seg+'</p>';
      }
    }
    // wrap consecutive <li> groups in <ul>
    h=h.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,function(m){return m;});
    pages.push({title:title,html:h});
  }
  return pages;
}

// Parse a .docx as a single page. Uses the embedded 20pt title if present,
// otherwise derives a title from the filename.
function parseDocxSinglePage(xml, fallbackTitle){
  const bodyMatch=xml.match(/<w:body>([\s\S]*)<\/w:body>/);
  const body=bodyMatch?bodyMatch[1]:xml;
  const paras=body.match(/<w:p\b[^>]*>[\s\S]*?<\/w:p>/g)||[];
  // Find a title: first 20pt paragraph that has text.
  let titleIdx=-1,title='';
  for(let i=0;i<paras.length;i++){
    if(_docxMaxSize(paras[i])===40){
      const t=_docxParaText(paras[i]);
      if(t){titleIdx=i;title=t;break;}
    }
  }
  if(!title)title=fallbackTitle||'Imported Page';
  // Body = everything except the title paragraph itself.
  let h='';
  for(let k=0;k<paras.length;k++){
    if(k===titleIdx)continue;
    const p=paras[k];
    const seg=_docxRunsHtml(p);
    if(!seg.trim())continue;
    const sz=_docxMaxSize(p);
    const isList=/<w:numPr>/.test(p);
    if(isList){h+='<li>'+seg+'</li>';}
    else if(sz===36||sz===32){h+='<h2>'+seg+'</h2>';}
    else{h+='<p>'+seg+'</p>';}
  }
  return {title:title,html:h};
}

// Top-level: read a .docx File, parse to pages, hand off to the create callback.
async function readDocxSinglePage(file){
  const buf=await file.arrayBuffer();
  const xml=await extractDocxEntry(buf,'word/document.xml');
  const fallback=file.name.replace(/\.docx$/i,'');
  return parseDocxSinglePage(xml,fallback);
}

async function readDocxSection(file){
  const buf=await file.arrayBuffer();
  const xml=await extractDocxEntry(buf,'word/document.xml');
  const pages=parseDocxNotebook(xml);
  const sectionName=file.name.replace(/\.docx$/i,'');
  return {sectionName:sectionName,pages:pages};
}

async function importDocxNotebook(file, onNotebookReady){
  const buf=await file.arrayBuffer();
  const xml=await extractDocxEntry(buf,'word/document.xml');
  const pages=parseDocxNotebook(xml);
  if(!pages.length)throw new Error('No pages could be parsed from this document.');
  // Notebook name from filename (strip extension and leading codes).
  let nbName=file.name.replace(/\.docx$/i,'');
  onNotebookReady(nbName,pages);
  return pages.length;
}

// ── Import Destination Dialog ────────────────────────────────────────────────
// Two modes:
//   'section' — importing a multi-page section; user picks the destination Project
//   'page'    — importing a single page; user picks the destination Notebook Section
//               and can edit the page title (defaulted to the embedded title).
const ImportDestinationModal=({mode,payload,projects,onConfirm,onClose})=>{
  // Build the flat list of sections across projects for the page-mode dropdown.
  const sections=[];
  projects.forEach(function(p){
    (p.children||[]).forEach(function(n){
      sections.push({projId:p.id,projTitle:p.title,nbId:n.id,nbTitle:n.title});
    });
  });

  const[projChoice,setProjChoice]=useState(projects.length?projects[0].id:'__new__');
  const[newProjName,setNewProjName]=useState('');
  const[sectionChoice,setSectionChoice]=useState(sections.length?sections[0].nbId:'__new__');
  const[newSectionName,setNewSectionName]=useState('');
  // For new-section path in page mode, also need a project to host it.
  const[newSectionProj,setNewSectionProj]=useState(projects.length?projects[0].id:'__new__');
  const[pageTitle,setPageTitle]=useState(mode==='page'&&payload?(payload.title||''):'');
  const[sectionName,setSectionName]=useState(mode==='section'&&payload?(payload.sectionName||''):'');

  const titleText=mode==='section'?'Import Notebook Section':'Import Page';
  const summary=mode==='section'
    ? ('This file contains '+(payload?payload.pages.length:0)+' page'+((payload&&payload.pages.length===1)?'':'s')+'. Choose the project to create the new section under.')
    : 'Choose the notebook section to add this page to, and confirm the page name.';

  // Resolve a single page-title collision against an array of existing titles.
  // Returns one of: {action:'replace',title} | {action:'add',title} | {action:'cancel'}
  function resolvePageCollision(title, existingTitles){
    let current=title;
    // No collision - accept as-is.
    if(existingTitles.indexOf(current)===-1)return {action:'add',title:current};
    // Loop until resolved or cancelled.
    while(true){
      const replace=window.confirm('A page named "'+current+'" already exists in this section.\n\nClick OK to REPLACE the existing page, or Cancel to add as a NEW page with a different name.');
      if(replace){
        return {action:'replace',title:current};
      }
      const renamed=window.prompt('Enter a new name for the imported page:', current+' (imported)');
      if(renamed===null)return {action:'cancel'};
      current=renamed.trim();
      if(!current){alert('Name cannot be empty.');continue;}
      if(existingTitles.indexOf(current)===-1)return {action:'add',title:current};
      // still collides - loop again
    }
  }

  const confirm=()=>{
    if(mode==='section'){
      let projId=projChoice;
      let createProj=null;
      if(projChoice==='__new__'){
        if(!newProjName.trim()){alert('Enter a name for the new project.');return;}
        createProj=newProjName.trim();
      }
      const finalSection=(sectionName.trim())||(payload?payload.sectionName:'Imported Section')||'Imported Section';
      // Section-name collision check (only when importing into an existing project).
      let mergeIntoNbId=null;
      if(!createProj){
        const targetProj=projects.find(function(p){return p.id===projId;});
        const existingNb=targetProj&&(targetProj.children||[]).find(function(n){return n.title===finalSection;});
        if(existingNb){
          const merge=window.confirm('A section named "'+finalSection+'" already exists in this project.\n\nClick OK to MERGE the imported pages into that existing section, or Cancel to stop and choose a different name.');
          if(!merge)return; // user cancels to rename
          mergeIntoNbId=existingNb.id;
        }
      }
      // If merging, resolve per-page collisions against the existing section's pages.
      let resolvedPages=payload.pages.map(function(pg){return {title:pg.title,html:pg.html,_action:'add'};});
      if(mergeIntoNbId){
        const targetProj=projects.find(function(p){return p.id===projId;});
        const existingNb=targetProj.children.find(function(n){return n.id===mergeIntoNbId;});
        const existingTitles=(existingNb.children||[]).map(function(x){return x.title;});
        const runningTitles=existingTitles.slice();
        for(let i=0;i<resolvedPages.length;i++){
          const r=resolvePageCollision(resolvedPages[i].title, runningTitles);
          if(r.action==='cancel')return; // abort whole import
          resolvedPages[i].title=r.title;
          resolvedPages[i]._action=r.action;
          // A replaced page keeps the same title; an added page introduces a new title.
          if(runningTitles.indexOf(r.title)===-1)runningTitles.push(r.title);
        }
      }
      onConfirm({mode:'section',projId:projId,createProjName:createProj,sectionName:finalSection,
        mergeIntoNbId:mergeIntoNbId,pages:resolvedPages});
    } else {
      // page mode
      if(!pageTitle.trim()){alert('Enter a page title.');return;}
      if(sectionChoice==='__new__'){
        if(!newSectionName.trim()){alert('Enter a name for the new section.');return;}
        let hostProj=newSectionProj;
        let createProj=null;
        if(newSectionProj==='__new__'){
          if(!newProjName.trim()){alert('Enter a name for the new project to hold the section.');return;}
          createProj=newProjName.trim();
        }
        // New section can't have collisions - it's empty.
        onConfirm({mode:'page',createSectionName:newSectionName.trim(),hostProjId:hostProj,createProjName:createProj,
          page:{title:pageTitle.trim(),html:payload.html,_action:'add'}});
      } else {
        const sec=sections.find(function(x){return x.nbId===sectionChoice;});
        // Check for a page-title collision in the chosen existing section.
        const targetProj=projects.find(function(p){return p.id===(sec?sec.projId:null);});
        const targetNb=targetProj&&(targetProj.children||[]).find(function(n){return n.id===sectionChoice;});
        const existingTitles=targetNb?(targetNb.children||[]).map(function(x){return x.title;}):[];
        const r=resolvePageCollision(pageTitle.trim(), existingTitles);
        if(r.action==='cancel')return;
        onConfirm({mode:'page',nbId:sectionChoice,projId:sec?sec.projId:null,
          page:{title:r.title,html:payload.html,_action:r.action}});
      }
    }
  };

  const labelStyle={fontSize:'12px',fontWeight:600,color:'var(--text-2)',display:'block',marginBottom:'6px'};
  const groupStyle={marginBottom:'16px'};

  return(
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" style={{width:'480px'}} onClick={function(e){e.stopPropagation();}}>
        <div className="modal-header"><span className="modal-title">{titleText}</span><button className="rail-btn" onClick={onClose}><I name="X" size={14}/></button></div>
        <div className="modal-body">
          <div style={{fontSize:'12px',color:'var(--text-3)',lineHeight:1.5,marginBottom:'18px'}}>{summary}</div>

          {mode==='section'&&(
            <div>
              <div style={groupStyle}>
                <label style={labelStyle}>Section name</label>
                <input className="form-input" value={sectionName} onChange={function(e){setSectionName(e.target.value);}} placeholder="Notebook section name"/>
              </div>
              <div style={groupStyle}>
                <label style={labelStyle}>Destination project</label>
                <select className="form-select" value={projChoice} onChange={function(e){setProjChoice(e.target.value);}}>
                  {projects.map(function(p){return <option key={p.id} value={p.id}>{p.title}</option>;})}
                  <option value="__new__">+ Create new project...</option>
                </select>
              </div>
              {projChoice==='__new__'&&(
                <div style={groupStyle}>
                  <label style={labelStyle}>New project name</label>
                  <input className="form-input" value={newProjName} onChange={function(e){setNewProjName(e.target.value);}} placeholder="New project name"/>
                </div>
              )}
            </div>
          )}

          {mode==='page'&&(
            <div>
              <div style={groupStyle}>
                <label style={labelStyle}>Page title</label>
                <input className="form-input" value={pageTitle} onChange={function(e){setPageTitle(e.target.value);}} placeholder="Page title"/>
              </div>
              <div style={groupStyle}>
                <label style={labelStyle}>Destination notebook section</label>
                <select className="form-select" value={sectionChoice} onChange={function(e){setSectionChoice(e.target.value);}}>
                  {sections.map(function(x){return <option key={x.nbId} value={x.nbId}>{x.projTitle} / {x.nbTitle}</option>;})}
                  <option value="__new__">+ Create new section...</option>
                </select>
              </div>
              {sectionChoice==='__new__'&&(
                <div>
                  <div style={groupStyle}>
                    <label style={labelStyle}>New section name</label>
                    <input className="form-input" value={newSectionName} onChange={function(e){setNewSectionName(e.target.value);}} placeholder="New section name"/>
                  </div>
                  <div style={groupStyle}>
                    <label style={labelStyle}>Place new section under project</label>
                    <select className="form-select" value={newSectionProj} onChange={function(e){setNewSectionProj(e.target.value);}}>
                      {projects.map(function(p){return <option key={p.id} value={p.id}>{p.title}</option>;})}
                      <option value="__new__">+ Create new project...</option>
                    </select>
                  </div>
                  {newSectionProj==='__new__'&&(
                    <div style={groupStyle}>
                      <label style={labelStyle}>New project name</label>
                      <input className="form-input" value={newProjName} onChange={function(e){setNewProjName(e.target.value);}} placeholder="New project name"/>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}
        </div>
        <div className="modal-footer" style={{display:'flex',gap:'8px',justifyContent:'flex-end'}}>
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={confirm}>Import</button>
        </div>
      </div>
    </div>
  );
};

  const sectionRef=useRef(null);const pageRef=useRef(null);const jsonRef=useRef(null);

        <div className="modal-header"><span className="modal-title">Settings</span><button className="rail-btn" onClick={onClose}><I name="X" size={14}/></button></div>
        <div className="modal-body scr" style={{display:'flex',flexDirection:'column',gap:'20px',maxHeight:'70vh',overflowY:'auto'}}>
          <div>
            <div style={{fontSize:'11px',fontWeight:700,color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:'12px',paddingBottom:'8px',borderBottom:'1px solid var(--border)'}}>Appearance</div>
            <div><label className="form-label">Theme</label>

                <option value="dark">Dark (default)</option>
                <option value="dim">Dim (softer contrast)</option>
                <option value="light">Light</option>
              </select>
              <div style={{fontSize:'11px',color:'var(--text-3)',marginTop:'6px',lineHeight:1.5}}>Changes the app interface. The note page itself stays light like paper for readability. Applies immediately on save.</div>
            </div>
          </div>
          <div>
            <div style={{fontSize:'11px',fontWeight:700,color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:'12px',paddingBottom:'8px',borderBottom:'1px solid var(--border)'}}>AI Configuration</div>
            <div style={{display:'flex',flexDirection:'column',gap:'10px'}}>
              <div><label className="form-label">Gemini API Key</label><input type="password" className="form-input" value={s.apiKey||''} onChange={e=>setS({...s,apiKey:e.target.value})} placeholder="AIza..."/></div>
              <div><label className="form-label">Model Preference</label>
                <select className="form-select" value={s.model||'auto'} onChange={e=>setS({...s,model:e.target.value})}>
                  <option value="auto">Auto (recommended — finds a working model)</option>
                  <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                  <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                  <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash-Lite</option>
                  <option value="gemini-flash-latest">Gemini Flash (latest)</option>
                  <option value="gemini-pro-latest">Gemini Pro (latest)</option>
                </select>
                <div style={{fontSize:'11px',color:'var(--text-3)',marginTop:'6px',lineHeight:1.5}}>Auto mode queries your API key for available models and selects a working one automatically, retrying alternatives if a model is unavailable. This prevents failures when Google retires preview models.</div>
              </div>
            </div>
          </div>
          <div>
            <div style={{fontSize:'11px',fontWeight:700,color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:'12px',paddingBottom:'8px',borderBottom:'1px solid var(--border)'}}>Import from OneNote</div>
            <div style={{display:'flex',gap:'8px'}}>
              <button className="btn btn-ghost" style={{flex:1}} onClick={()=>sectionRef.current?.click()}><I name="Upload" size={13}/> Notebook Section</button>
              <button className="btn btn-ghost" style={{flex:1}} onClick={()=>pageRef.current?.click()}><I name="Upload" size={13}/> Single Page</button>
            </div>
            <div style={{fontSize:'11px',color:'var(--text-3)',marginTop:'6px',lineHeight:1.5}}>In OneNote: File &gt; Export. Choose Section to import all its pages as a new notebook section, or export a single page. You will choose the destination next.</div>
            <input ref={sectionRef} type="file" accept=".docx" hidden onChange={function(e){
              const f=e.target.files[0];if(!f)return;
              readDocxSection(f).then(function(res){
                if(!res.pages||!res.pages.length){alert('No pages could be parsed from this file.');return;}
                onStageImport({mode:'section',payload:res});
              }).catch(function(err){alert('Could not read file: '+err.message);});
              e.target.value='';
            }}/>
            <input ref={pageRef} type="file" accept=".docx" hidden onChange={function(e){
              const f=e.target.files[0];if(!f)return;
              readDocxSinglePage(f).then(function(pg){
                onStageImport({mode:'page',payload:pg});
              }).catch(function(err){alert('Could not read file: '+err.message);});
              e.target.value='';
            }}/>
          </div>
          <div>
            <div style={{fontSize:'11px',fontWeight:700,color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:'12px',paddingBottom:'8px',borderBottom:'1px solid var(--border)'}}>Backup & Restore</div>
            <div style={{display:'flex',gap:'8px'}}>
              <button className="btn btn-ghost" style={{flex:1}} onClick={exportJson}><I name="Download" size={13}/> Export JSON</button>
              <button className="btn btn-ghost" style={{flex:1}} onClick={()=>jsonRef.current?.click()}><I name="Upload" size={13}/> Import JSON</button>
              <input ref={jsonRef} type="file" accept=".json" hidden onChange={e=>{
                const f=e.target.files[0];if(!f)return;
                const r=new FileReader();r.onload=async function(ev){
                  try{
                    const d=JSON.parse(ev.target.result);
                    if(!Array.isArray(d))throw new Error('Invalid format: root must be an array');
                    if(!d.length)throw new Error('File contains no projects');
                    // Write directly to IndexedDB - bypasses localStorage quota entirely
                    await Promise.all(d.map(function(p){return idb.putProject(p);}));
                    alert('Import successful. The page will now reload.');
                    window.location.reload();
                  }catch(err){alert('Import failed: '+err.message);}
                };r.readAsText(f);
              }}/>
            </div>
          </div>
          <div style={{background:'var(--panel-bg)',border:'1px solid var(--border)',borderRadius:'6px',padding:'12px 14px',fontSize:'11.5px',color:'var(--text-3)',fontFamily:'IBM Plex Mono',lineHeight:1.8}}>
            LoCoNotes OneView v{APP_VER}<br/>
            DB: {DB_NAME} v{DB_VER}<br/>
            Storage: IndexedDB + localStorage
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={()=>{onSave(s);onClose();}}>Save Settings</button>
        </div>
      </div>
    </div>
  );
};
