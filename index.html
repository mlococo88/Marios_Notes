// ── Main App ───────────────────────────────────────────────────────────────
function App(){
  const[projects,setProjects]=useState([]);
  const[status,setStatus]=useState('loading');
  const[syncStatus,setSyncStatus]=useState('ok');
  const[clients,setClients]=useState([]);
  const[expanded,setExpanded]=useState({});
  const[templates,setTemplates]=useState([]);
  const[settings,setSettings]=useState({apiKey:'',model:'auto',theme:'dark'});
  // Apply the selected theme to the document root so the CSS variable sets switch.
  useEffect(function(){
    const t=(settings&&settings.theme)||'dark';
    document.documentElement.setAttribute('data-theme',t);
  },[settings&&settings.theme]);
  // Register a callback so the AI resolver can persist a discovered working
  // model back into settings (avoids re-discovery on every subsequent call).
  useEffect(function(){
    window._lcOnModelResolved=function(model){
      setSettings(function(prev){
        if(prev.model===model)return prev;
        const next=Object.assign({},prev,{resolvedModel:model});
        // Note: we store as resolvedModel, not model, so the user's explicit
        // preference (including 'auto') is preserved. The resolver treats
        // 'auto' as "no preference" and uses discovery + priority order.
        return next;
      });
    };
    return function(){delete window._lcOnModelResolved;};
  },[]);
  const[selProj,setSelProj]=useState(null);
  const[selNote,setSelNote]=useState(null);
  const[selPage,setSelPage]=useState(null);
  const[selPage2,setSelPage2]=useState(null);
  const[activePane,setActivePane]=useState('primary');
  const[panelW,setPanelW]=useState({projects:220,notebooks:200,pages:210});
  const[aiWidth,setAiWidth]=useState(400);
  const[splitRatio,setSplitRatio]=useState(50);
  const[zenMode,setZenMode]=useState(false);
  const[splitMode,setSplitMode]=useState(false);
  const[aiOpen,setAiOpen]=useState(false);
  const[editingId,setEditingId]=useState(null);
  const[editVal,setEditVal]=useState('');
  const[modal,setModal]=useState(null);
  const[isMobile,setIsMobile]=useState(window.innerWidth<768);
  const[mobileView,setMobileView]=useState('projects');
  // Engineering blocks now stored inline in page records (engBlocks field)
  const engineRef=useRef(null);
  const engine2Ref=useRef(null);
  const pdfRef=useRef(null);

  // Init
  useEffect(()=>{
    const init=async()=>{
      try{
        // Settings
        const sv=await idb.getSetting('appSettings');
        if(sv?.value)setSettings(sv.value);
        else{const ls=localStorage.getItem('neuronote_settings');if(ls)try{setSettings(JSON.parse(ls));}catch(e){}}
        // Projects
        // Run v1->v2 migration on first load
        const migrated=await migrateFromV1();
        let data=await idb.getAllProjects();
        if(!data.length&&migrated&&migrated.length)data=migrated;
        // Check for pending import
        // lc_import localStorage staging removed - import now writes directly to IndexedDB
        localStorage.removeItem('lc_import'); // clean up any stale staging data
        if(!data.length){data=INITIAL_DATA;await Promise.all(data.map(p=>idb.putProject(p)));}
        const discovered=[...new Set(data.map(p=>p.client||'General'))];
        // Merge with any persisted client-group order (preserves manual ordering
        // and keeps empty groups the user created that have no projects yet).
        let stored=null;
        try{const so=await idb.getSetting('clientOrder');if(so&&Array.isArray(so.value))stored=so.value;}catch(e){}
        let cl;
        if(stored){
          // Keep stored order, drop stored names that have neither projects nor
          // intentional existence, then append any newly discovered names.
          cl=stored.slice();
          discovered.forEach(function(c){if(cl.indexOf(c)===-1)cl.push(c);});
        } else {
          cl=discovered;
        }
        // Guarantee 'General' always exists as a home for unassigned projects.
        if(cl.indexOf('General')===-1)cl.unshift('General');
        setClients(cl);
        const exp={};cl.forEach(c=>exp[c]=true);setExpanded(exp);
        // Migrate eng blocks from localStorage into page records (one-time)
        try{
          const rawEb=localStorage.getItem('lc_engBlocks');
          if(rawEb){
            const eb=JSON.parse(rawEb);
            const migrateBlocks=function(projects,ebMap){
              const result=[];
              for(let i=0;i<projects.length;i++){
                const proj=projects[i];
                const notebooks=proj.children||[];
                const newNbs=[];
                for(let j=0;j<notebooks.length;j++){
                  const nb=notebooks[j];
                  const pages=nb.children||[];
                  const newPgs=[];
                  for(let k=0;k<pages.length;k++){
                    const pg=pages[k];
                    if(ebMap[pg.id]&&(!pg.engBlocks||pg.engBlocks.length===0)){
                      newPgs.push(Object.assign({},pg,{engBlocks:ebMap[pg.id]}));
                    } else {
                      newPgs.push(pg);
                    }
                  }
                  newNbs.push(Object.assign({},nb,{children:newPgs}));
                }
                result.push(Object.assign({},proj,{children:newNbs}));
              }
              return result;
            };
            data=migrateBlocks(data,eb);
            localStorage.removeItem('lc_engBlocks');
            console.log('[LoCoNotes] Eng block migration complete.');
          }
        }catch(e){console.warn('Eng block migration error:',e);}
        // One-time migration: metadata moved from project level down to notebook (task) level.
        // Move any existing project.metadata into its first notebook if that notebook has none.
        try{
          const migFlag=localStorage.getItem('lc_meta_to_notebook');
          if(!migFlag){
            let changed=false;
            data=data.map(function(p){
              const pm=p.metadata||{};
              const hasProjMeta=Object.keys(pm).length>0;
              if(!hasProjMeta)return p;
              const nbs=p.children||[];
              if(!nbs.length)return p; // nowhere to move it; leave as-is
              const first=nbs[0];
              const nbMeta=first.metadata||{};
              if(Object.keys(nbMeta).length>0)return p; // notebook already has its own
              changed=true;
              const newNbs=nbs.slice();
              newNbs[0]=Object.assign({},first,{metadata:pm,events:first.events||p.events||[]});
              return Object.assign({},p,{children:newNbs,metadata:{}});
            });
            localStorage.setItem('lc_meta_to_notebook','1');
            if(changed)console.log('[LoCoNotes] Migrated project metadata to task level.');
          }
        }catch(e){console.warn('Metadata migration error:',e);}
        setProjects(data);
        // Store session data for restoration after projects state updates
        // Using a ref avoids the async batching race between setProjects and setSelXxx
        window._lcInitData=data;
        setStatus('ready');
        // Templates
        const tpls=await idb.getAllTemplates();
        setTemplates(tpls.length?tpls:INITIAL_TEMPLATES);
        // status is set to ready after projects are stored (above)
      }catch(e){console.error(e);setStatus('error');}
    };
    init();
    const onResize=()=>setIsMobile(window.innerWidth<768);
    window.addEventListener('resize',onResize);
    return()=>window.removeEventListener('resize',onResize);
  },[]);

  // Auto-save
  // Session restore effect: fires after projects state is populated
  // Runs once when projects goes from empty to populated
  const sessionRestored=useRef(false);
  useEffect(()=>{
    if(sessionRestored.current)return;
    if(!projects.length)return;
    if(!window._lcInitData)return;
    sessionRestored.current=true;
    const data=window._lcInitData;
    delete window._lcInitData;
    const lp=localStorage.getItem('lc_lastProj');
    let selP=null,selN=null,selPg=null;
    if(lp&&data.find(function(p){return p.id===lp;})){
      selP=lp;
      const ln=localStorage.getItem('lc_lastNote');
      const lpg=localStorage.getItem('lc_lastPage');
      // Walk the tree to verify and resolve the full parent chain
      outer:for(let i=0;i<data.length;i++){
        const proj=data[i];
        const nbs=proj.children||[];
        for(let j=0;j<nbs.length;j++){
          const nb=nbs[j];
          const pgs=nb.children||[];
          for(let k=0;k<pgs.length;k++){
            if(pgs[k].id===lpg){selP=proj.id;selN=nb.id;selPg=lpg;break outer;}
          }
        }
      }
      if(!selPg&&ln){
        // No matching page - just restore notebook
        selN=ln;
      }
    } else if(data.length){
      selP=data[0].id;
    }
    if(selP)setSelProj(selP);
    if(selN)setSelNote(selN);
    if(selPg)setSelPage(selPg);
  },[projects]);

  const dProjects=useDebounce(projects,700);
  useEffect(()=>{
    if(status!=='ready')return;
    setSyncStatus('saving');
    Promise.all(dProjects.map(p=>idb.putProject(p))).then(()=>setSyncStatus('ok')).catch(()=>setSyncStatus('error'));
  },[dProjects,status]);

  // Save eng blocks
  // engBlocks saved via normal project autosave - no separate effect needed

  // Session
  useEffect(()=>{if(selProj)localStorage.setItem('lc_lastProj',selProj);},[selProj]);
  useEffect(()=>{if(selNote)localStorage.setItem('lc_lastNote',selNote);},[selNote]);
  useEffect(()=>{if(selPage)localStorage.setItem('lc_lastPage',selPage);},[selPage]);

  // Keyboard shortcuts
  useKbd(useMemo(()=>({
    'ctrl+p':()=>setModal('search'),
    'ctrl+k':()=>setModal('search'),
    'ctrl+\\':()=>setAiOpen(o=>!o),
    'ctrl+shift+s':()=>setSplitMode(m=>!m),
    'ctrl+shift+z':()=>setZenMode(z=>!z),
    'escape':()=>{if(modal)setModal(null);},
  }),[modal]));

  // Derived state
  const updateTree=useCallback(fn=>setProjects(prev=>prev.map(fn)),[]);
  // Single-pass lookup: derive all three levels in one memo
  // avoids the cascading dependency chain that fails when state updates are batched
  const {activeProject,activeNotebook,activePage}=useMemo(()=>{
    const proj=projects.find(function(p){return p.id===selProj;})||null;
    const nb=proj?(proj.children||[]).find(function(n){return n.id===selNote;})||null:null;
    const pg=nb?(nb.children||[]).find(function(p){return p.id===selPage;})||null:null;
    return{activeProject:proj,activeNotebook:nb,activePage:pg};
  },[projects,selProj,selNote,selPage]);

  const secondaryInfo=useMemo(()=>{
    if(!selPage2)return{secondaryPage:null};
    for(let i=0;i<projects.length;i++){
      const nbs=projects[i].children||[];
      for(let j=0;j<nbs.length;j++){
        const pgs=nbs[j].children||[];
        for(let k=0;k<pgs.length;k++){
          if(pgs[k].id===selPage2)return{secondaryPage:pgs[k]};
        }
      }
    }
    return{secondaryPage:null};
  },[projects,selPage2]);
  const secondaryPage=secondaryInfo.secondaryPage;
  // secondaryPage now derived in secondaryInfo memo above

  const updatePageContent=useCallback((id,html)=>{
    // Uses functional updater - safe with empty dep array
    // The prev=> form always operates on current state regardless of closure age
    setProjects(function(prev){
      return prev.map(function(p){
        return Object.assign({},p,{children:(p.children||[]).map(function(n){
          return Object.assign({},n,{children:(n.children||[]).map(function(pg){
            return pg.id===id?Object.assign({},pg,{content:html}):pg;
          })});
        })});
      });
    });
  },[]);
  const updatePageProp=useCallback((updates)=>{
    if(!activePage)return;
    updateTree(p=>({...p,children:p.children?.map(n=>({...n,children:n.children?.map(pg=>pg.id===activePage.id?{...pg,...updates}:pg)}))}));
  },[activePage,updateTree]);

  const insertEngBlock=(type)=>{
    if(!activePage)return;
    const id='eb_'+Date.now();
    const blockTitle=ENG_BLOCK_TYPES.find(function(b){return b.id===type;});
    const nb={id:id,type:type,title:blockTitle?blockTitle.label:type};
    const pageId=activePage.id;
    updateTree(function(p){
      const newNbs=(p.children||[]).map(function(n){
        const newPgs=(n.children||[]).map(function(pg){
          if(pg.id===pageId){
            const existing=pg.engBlocks||[];
            return Object.assign({},pg,{engBlocks:existing.concat([nb])});
          }
          return pg;
        });
        return Object.assign({},n,{children:newPgs});
      });
      return Object.assign({},p,{children:newNbs});
    });
  };

  // Navigation
  const selectPage=(pageId,e)=>{
    // Always resolve parent notebook and project from pageId
    // so the lookup chain activeProject->activeNotebook->activePage never breaks
    let foundProjId=null,foundNoteId=null;
    for(let i=0;i<projects.length;i++){
      const proj=projects[i];
      const nbs=proj.children||[];
      for(let j=0;j<nbs.length;j++){
        const nb=nbs[j];
        const pgs=nb.children||[];
        for(let k=0;k<pgs.length;k++){
          if(pgs[k].id===pageId){foundProjId=proj.id;foundNoteId=nb.id;break;}
        }
        if(foundNoteId)break;
      }
      if(foundProjId)break;
    }
    if(e?.altKey){
      setSelPage2(pageId);setSplitMode(true);setActivePane('secondary');
    } else {
      if(foundProjId)setSelProj(foundProjId);
      if(foundNoteId)setSelNote(foundNoteId);
      setSelPage(pageId);
      setActivePane('primary');
      setMobileView('editor');
    }
  };
  const selectProject=(id)=>{setSelProj(id);setSelNote(null);setSelPage(null);setMobileView('notebooks');};
  const selectNotebook=(id)=>{setSelNote(id);setSelPage(null);setMobileView('pages');};

  // Edit
  const startEdit=(e,item)=>{e.stopPropagation();setEditingId(item.id);setEditVal(item.title);};
  const saveEdit=(id,scope)=>{
    if(scope==='project')updateTree(p=>p.id===id?{...p,title:editVal}:p);
    else if(scope==='notebook')updateTree(p=>p.id===selProj?{...p,children:p.children.map(n=>n.id===id?{...n,title:editVal}:n)}:p);
    else updateTree(p=>({...p,children:p.children?.map(n=>({...n,children:n.children?.map(pg=>pg.id===id?{...pg,title:editVal}:pg)}))}));
    setEditingId(null);
  };
  const editKeyDown=(e,id,scope)=>{if(e.key==='Enter'){saveEdit(id,scope);}if(e.key==='Escape')setEditingId(null);};

  // Add
  const addProject=(clientGroup)=>{
    const id='proj_'+Date.now();
    const grp=(typeof clientGroup==='string'&&clientGroup)?clientGroup:(clients[0]||'General');
    setProjects(prev=>[...prev,{id,type:'project',client:grp,title:'New Project',children:[],events:[],metadata:{}}]);
    // Make sure the destination group is expanded so the new project is visible.
    setExpanded(prev=>Object.assign({},prev,{[grp]:true}));
    setSelProj(id);setSelNote(null);setSelPage(null);
    setTimeout(()=>{setEditingId(id);setEditVal('New Project');},80);
  };
  // Create a new notebook from imported OneNote pages in the selected project.
  // Staged import payload drives the destination dialog (null when closed).
  const[importStage,setImportStage]=useState(null);
  const handleStageImport=(stage)=>{setImportStage(stage);setModal(null);};

  // Confirm handler: create section or page at the chosen destination,
  // creating a new project or section inline when requested.
  const handleImportConfirm=(result)=>{
    const ts=Date.now();
    function makePage(pg,i){
      return {id:'pg_'+ts+'_'+i,type:'page',title:pg.title||('Page '+(i+1)),
        content:pg.html||'',createdAt:ts,level:0,pageSize:'Letter',pageBackground:'None'};
    }
    // Merge a list of resolved import pages into an existing children array.
    // 'replace' pages overwrite the existing page of the same title (preserving its id);
    // 'add' pages are appended.
    function mergePages(existing,incoming){
      let out=existing.slice();
      incoming.forEach(function(pg,i){
        if(pg._action==='replace'){
          const idx=out.findIndex(function(x){return x.title===pg.title;});
          if(idx!==-1){
            out[idx]=Object.assign({},out[idx],{content:pg.html||'',createdAt:ts});
            return;
          }
        }
        out=out.concat([makePage(pg,i)]);
      });
      return out;
    }

    if(result.mode==='section'){
      if(result.mergeIntoNbId){
        // Merge resolved pages into the existing section.
        updateTree(function(p){
          if(p.id!==result.projId)return p;
          return Object.assign({},p,{children:(p.children||[]).map(function(n){
            if(n.id!==result.mergeIntoNbId)return n;
            return Object.assign({},n,{children:mergePages(n.children||[],result.pages)});
          })});
        });
        setSelProj(result.projId);
        setSelNote(result.mergeIntoNbId);
      } else {
        // Create a fresh section.
        const nbId='nb_'+ts;
        const newNb={id:nbId,type:'notebook',title:result.sectionName||'Imported Section',
          children:result.pages.map(makePage)};
        if(result.createProjName){
          const projId='proj_'+ts;
          const newProj={id:projId,type:'project',title:result.createProjName,client:'General',metadata:{},events:[],children:[newNb]};
          setProjects(function(prev){return prev.concat([newProj]);});
          setSelProj(projId);
        } else {
          updateTree(function(p){
            return p.id===result.projId?Object.assign({},p,{children:(p.children||[]).concat([newNb])}):p;
          });
          setSelProj(result.projId);
        }
        setSelNote(nbId);
        const firstPg=newNb.children[0];
        if(firstPg)setSelPage(firstPg.id);
      }
    } else {
      // page mode
      if(result.createSectionName){
        const nbId='nb_'+ts;
        const newNb={id:nbId,type:'notebook',title:result.createSectionName,children:[makePage(result.page,0)]};
        if(result.createProjName){
          const projId='proj_'+ts;
          const newProj={id:projId,type:'project',title:result.createProjName,client:'General',metadata:{},events:[],children:[newNb]};
          setProjects(function(prev){return prev.concat([newProj]);});
          setSelProj(projId);
        } else {
          updateTree(function(p){
            return p.id===result.hostProjId?Object.assign({},p,{children:(p.children||[]).concat([newNb])}):p;
          });
          setSelProj(result.hostProjId);
        }
        setSelNote(nbId);
        setSelPage(newNb.children[0].id);
      } else {
        // append or replace within existing section
        let selectedPageId=null;
        updateTree(function(p){
          if(p.id!==result.projId)return p;
          return Object.assign({},p,{children:(p.children||[]).map(function(n){
            if(n.id!==result.nbId)return n;
            const merged=mergePages(n.children||[],[result.page]);
            // Determine which page to select after merge.
            const match=merged.find(function(x){return x.title===result.page.title;});
            if(match)selectedPageId=match.id;
            return Object.assign({},n,{children:merged});
          })});
        });
        if(result.projId)setSelProj(result.projId);
        setSelNote(result.nbId);
        if(selectedPageId)setSelPage(selectedPageId);
      }
    }
    setImportStage(null);
  };

  const addNotebook=()=>{if(!activeProject)return;const id='nb_'+Date.now();updateTree(p=>p.id===selProj?{...p,children:[...p.children,{id,type:'notebook',title:'New Notebook',children:[]}]}:p);setSelNote(id);setTimeout(()=>{setEditingId(id);setEditVal('New Notebook');},80);};
  const addPage=()=>{if(!activeNotebook)return;const id='pg_'+Date.now();updateTree(p=>({...p,children:p.children?.map(n=>n.id===selNote?{...n,children:[...n.children,{id,type:'page',title:'New Page',content:'',createdAt:Date.now(),level:0}]}:n)}));setSelPage(id);setMobileView('editor');setTimeout(()=>{setEditingId(id);setEditVal('New Page');},80);};
  // Persist the client-group order so manual ordering and empty groups survive reloads.
  const persistClientOrder=(arr)=>{try{idb.putSetting('clientOrder',arr);}catch(e){}};

  const addClient=()=>{
    const name=prompt('New client group name:');
    if(!name)return;
    const trimmed=name.trim();
    if(!trimmed){alert('Name cannot be empty.');return;}
    if(clients.includes(trimmed)){alert('A client group with that name already exists.');return;}
    const nc=clients.concat([trimmed]);
    setClients(nc);persistClientOrder(nc);
    setExpanded(prev=>Object.assign({},prev,{[trimmed]:true}));
  };

  const deleteClient=(e,name)=>{
    e.stopPropagation();
    if(name==='General'){alert('The General group cannot be deleted; it is the default home for unassigned projects.');return;}
    const inGroup=projects.filter(function(p){return (p.client||'General')===name;});
    if(inGroup.length>0){
      const ok=window.confirm('"'+name+'" contains '+inGroup.length+' project'+(inGroup.length===1?'':'s')+'.\n\nClick OK to move '+(inGroup.length===1?'it':'them')+' to the General group and delete this client group. Click Cancel to keep the group.');
      if(!ok)return;
      // Reassign those projects to General.
      setProjects(function(prev){return prev.map(function(p){
        return (p.client||'General')===name?Object.assign({},p,{client:'General'}):p;
      });});
    }
    const nc=clients.filter(function(c){return c!==name;});
    // Ensure General still present.
    if(nc.indexOf('General')===-1)nc.unshift('General');
    setClients(nc);persistClientOrder(nc);
    setExpanded(function(prev){const n=Object.assign({},prev);delete n[name];return n;});
  };

  // Right-click context menu for moving a project to a different client group.
  const[ctxMenu,setCtxMenu]=useState(null); // {x,y,project} | null
  const openProjectMenu=(e,project)=>{
    e.preventDefault();e.stopPropagation();
    setCtxMenu({x:e.clientX,y:e.clientY,project:project});
  };
  const moveProjectToClient=(projId,group)=>{
    setProjects(function(prev){return prev.map(function(p){
      return p.id===projId?Object.assign({},p,{client:group}):p;
    });});
    setExpanded(function(prev){return Object.assign({},prev,{[group]:true});});
  };

  // Update a notebook's (task's) metadata and events.
  const updateNotebookMeta=(nbId,metadata,events)=>{
    updateTree(function(p){
      const nbs=p.children||[];
      if(!nbs.some(function(n){return n.id===nbId;}))return p;
      return Object.assign({},p,{children:nbs.map(function(n){
        return n.id===nbId?Object.assign({},n,{metadata:metadata,events:events||n.events||[]}):n;
      })});
    });
  };

  const moveClient=(e,name,dir)=>{
    e.stopPropagation();
    const idx=clients.indexOf(name);
    if(idx===-1)return;
    const swap=idx+dir;
    if(swap<0||swap>=clients.length)return;
    const nc=clients.slice();
    const tmp=nc[idx];nc[idx]=nc[swap];nc[swap]=tmp;
    setClients(nc);persistClientOrder(nc);
  };

  // Delete
  const delProject=(e,id)=>{e.stopPropagation();if(confirm('Delete this project and all its contents?')){idb.deleteProject(id).catch(function(err){console.warn('deleteProject failed:',err);});setProjects(prev=>prev.filter(p=>p.id!==id));if(selProj===id){setSelProj(null);setSelNote(null);setSelPage(null);}}};
  const delNotebook=(e,id)=>{e.stopPropagation();if(confirm('Delete this notebook and all its pages?')){updateTree(p=>p.id===selProj?{...p,children:p.children.filter(n=>n.id!==id)}:p);if(selNote===id){setSelNote(null);setSelPage(null);}}};
  const delPage=(e,id)=>{e.stopPropagation();if(confirm('Delete this page?')){updateTree(p=>({...p,children:p.children?.map(n=>({...n,children:n.children?.filter(pg=>pg.id!==id)}))}));if(selPage===id)setSelPage(null);if(selPage2===id)setSelPage2(null);}};

  // Indent/outdent pages
  const indentPage=(e,id)=>{e.stopPropagation();updateTree(p=>({...p,children:p.children?.map(n=>({...n,children:n.children?.map(pg=>pg.id===id?{...pg,level:Math.min((pg.level||0)+1,4)}:pg)}))}));};
  const outdentPage=(e,id)=>{e.stopPropagation();updateTree(p=>({...p,children:p.children?.map(n=>({...n,children:n.children?.map(pg=>pg.id===id?{...pg,level:Math.max((pg.level||0)-1,0)}:pg)}))}));};

  // Resizers
  const startPanelResize=(e,panel)=>{
    e.preventDefault();const startX=e.clientX,startW=panelW[panel];
    const mv=m=>setPanelW(prev=>({...prev,[panel]:Math.max(140,Math.min(480,startW+m.clientX-startX))}));
    const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
  };
  const startAIResize=(e)=>{
    e.preventDefault();const startX=e.clientX,startW=aiWidth;
    const mv=m=>setAiWidth(Math.max(300,Math.min(700,startW+(startX-m.clientX))));
    const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
  };
  const startSplitResize=(e)=>{
    e.preventDefault();const container=e.currentTarget.parentElement;const startX=e.clientX,startR=splitRatio;
    const mv=m=>{const dx=(m.clientX-startX)/container.offsetWidth*100;setSplitRatio(Math.max(20,Math.min(80,startR+dx)));};
    const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
  };

  // PDF upload
  const handlePdfUpload=async(e)=>{
    const file=e.target.files[0];if(!file||!activeNotebook)return;
    const reader=new FileReader();
    reader.onload=async(ev)=>{
      const b64=ev.target.result;let text='';
      try{if(typeof pdfjsLib!=='undefined'){const doc=await pdfjsLib.getDocument(b64).promise;for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);const c=await pg.getTextContent();text+=c.items.map(x=>x.str).join(' ')+'\n';}}}catch(err){console.warn(err);}
      const id='pg_'+Date.now();
      updateTree(p=>p.id===selProj?{...p,children:p.children.map(n=>n.id===selNote?{...n,children:[...n.children,{id,type:'page',title:file.name,content:'',mimeType:'application/pdf',pdfData:b64,extractedText:text,createdAt:Date.now(),level:0}]}:n)}:p);
    };
    reader.readAsDataURL(file);e.target.value='';
  };

  // Templates
  const loadTemplate=(tpl)=>{
    if(!activeNotebook){alert('Select a notebook first.');return;}
    const id='pg_'+Date.now();
    updateTree(p=>p.id===selProj?{...p,children:p.children.map(n=>n.id===selNote?{...n,children:[...n.children,{id,type:'page',title:tpl.name+' (Copy)',content:tpl.content,pageSize:tpl.pageSize,pageBackground:tpl.pageBackground,createdAt:Date.now(),level:0}]}:n)}:p);
    setSelPage(id);setMobileView('editor');
  };
  const saveTemplate=()=>{
    if(!activePage)return;const name=prompt('Template name:');if(!name)return;
    const t={id:'tpl_'+Date.now(),name,content:activePage.content,pageSize:activePage.pageSize||'Letter',pageBackground:activePage.pageBackground||'None'};
    idb.putTemplate(t);setTemplates(prev=>[...prev,t]);alert('Template "'+name+'" saved.');
  };
  const delTemplate=async(id)=>{if(confirm('Delete this template?')){await idb.deleteTemplate(id);setTemplates(prev=>prev.filter(t=>t.id!==id));}};

  // Page style
  const getPageStyle=(page)=>{
    if(!page)return{};
    const sz=page.pageSize||'Letter';const w=PAGE_SIZES[sz]?.w||'8.5in';const mh=PAGE_SIZES[sz]?.h||'11in';
    const bg=PAGE_BGS[page.pageBackground||'None'];
    return{width:w,minHeight:mh,...(bg?.style||{})};
  };

  // Editor pane renderer
  const renderEditorPane=(page,pane,engineR,isActive)=>{
    if(!page)return(
      <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:'12px',color:'var(--text-3)',background:'#d1d5db'}}>
        <div style={{fontSize:'48px',opacity:0.15}}>📄</div>
        <span style={{fontSize:'12.5px'}}>Select a page to edit</span>
        {pane==='secondary'&&<span style={{fontSize:'11px',opacity:0.7}}>Alt+Click a page to open here</span>}
      </div>
    );
    const pageBlocks=page.engBlocks||[];
    const bgCls=PAGE_BGS[page.pageBackground||'None']?.cls||'';
    return(
      <div className={'editor-canvas'+(isActive&&splitMode?' pane-active':'')} onClick={()=>setActivePane(pane)} style={{flex:1,overflow:'auto'}}>
        <div className={'page-sheet '+bgCls} style={getPageStyle(page)}>
          <input value={page.title}
            onChange={e=>updateTree(p=>({...p,children:p.children?.map(n=>({...n,children:n.children?.map(pg=>pg.id===page.id?{...pg,title:e.target.value}:pg)}))}))}
            className="page-title-input" placeholder="Page Title"/>
          <div className="page-meta">
            <span>Created: {new Date(page.createdAt||Date.now()).toLocaleString()}</span>
            {activeProject&&<span>Project: {activeProject.title}</span>}
            {activeNotebook&&<span>Notebook: {activeNotebook.title}</span>}
          </div>
          <hr className="page-divider"/>
          {page.mimeType==='application/pdf'?<PdfViewer pageData={page}/>:(
            <>
              <RichEditor key={page.id} engineRef={engineR} content={page.content} onChange={html=>updatePageContent(page.id,html)}/>
              <EngBlocksSection blocks={pageBlocks} onChange={function(blocks){
                const tgtId=page.id;
                updateTree(function(p){
                  const newNbs=(p.children||[]).map(function(n){
                    const newPgs=(n.children||[]).map(function(pg){
                      return pg.id===tgtId?Object.assign({},pg,{engBlocks:blocks}):pg;
                    });
                    return Object.assign({},n,{children:newPgs});
                  });
                  return Object.assign({},p,{children:newNbs});
                });
              }}/>
            </>
          )}
        </div>
      </div>
    );
  };

  if(status==='loading')return(
    <div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:'16px',background:'var(--panel-bg)'}}>
      <div style={{width:'40px',height:'40px',background:'var(--accent)',borderRadius:'10px',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'IBM Plex Mono',fontWeight:600,fontSize:'13px',color:'white',boxShadow:'0 0 24px rgba(37,99,235,0.5)'}}>LC</div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" strokeWidth="2" className="animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
      <div style={{fontSize:'12px',color:'var(--text-3)',fontFamily:'IBM Plex Mono'}}>Loading data...</div>
    </div>
  );
  if(status==='error')return(
    <div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:'12px',background:'var(--panel-bg)',padding:'40px'}}>
      <div style={{fontSize:'16px',fontWeight:700,color:'#ef4444'}}>Initialization Error</div>
      <div style={{fontSize:'12px',color:'var(--text-3)',fontFamily:'IBM Plex Mono',textAlign:'center',maxWidth:'400px'}}>Check browser console for details. Try opening in an incognito window.</div>
    </div>
  );

  const breadcrumbs=[activeProject&&{label:activeProject.title},activeNotebook&&{label:activeNotebook.title},activePage&&{label:activePage.title,current:true}].filter(Boolean);

  return(
    <div style={{display:'flex',height:'100vh',overflow:'hidden',background:'var(--panel-bg)'}}>

      {/* Rail */}
      <div className="rail no-print">
        <div className="rail-logo">LC</div>
        <button className={'rail-btn'+(zenMode?' active':'')} onClick={()=>setZenMode(z=>!z)}><I name="Maximize" size={16}/><span className="tooltip">Zen Mode ⌃⇧Z</span></button>
        <button className={'rail-btn'+(splitMode?' active':'')} onClick={()=>setSplitMode(m=>!m)}><I name="Cols" size={16}/><span className="tooltip">Split View ⌃⇧S</span></button>
        <div className="rail-divider"/>
        <button className="rail-btn" onClick={()=>setModal('search')}><I name="Search" size={16}/><span className="tooltip">Search ⌃P</span></button>
        <button className={'rail-btn'+(aiOpen?' active':'')} onClick={()=>setAiOpen(o=>!o)}><I name="Sparkles" size={16}/><span className="tooltip">AI Assistant ⌃\</span></button>
        <button className="rail-btn" onClick={()=>setModal('templates')}><I name="Layout" size={16}/><span className="tooltip">Templates</span></button>
        <div className="rail-divider"/>
        <button className="rail-btn" onClick={()=>setModal('diag')}><I name="Activity" size={16}/><span className="tooltip">Diagnostics</span></button>
        <div className="rail-spacer"/>
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',marginBottom:'4px'}}><div className={'sync-dot '+syncStatus} title={'Sync: '+syncStatus}/></div>
        <button className="rail-btn" onClick={()=>setModal('settings')}><I name="Settings" size={16}/><span className="tooltip">Settings</span></button>
      </div>

      {/* Panels + Editor */}
      <div style={{flex:1,display:'flex',overflow:'hidden',position:'relative'}}>

        {/* Projects panel */}
        {!zenMode&&(!isMobile||mobileView==='projects')&&(
          <div className="panel" style={{width:panelW.projects}}>
            <div className="panel-header">
              Projects
              <button className="si-act-btn" style={{marginLeft:'auto'}} title="Add Client Group" onClick={addClient}><I name="Users" size={12}/></button>
            </div>
            <div className="panel-body scr">
              {clients.map(client=>{
                const cp=projects.filter(p=>(p.client||'General')===client);
                return(
                  <div key={client}>
                    <div className="client-group-header" onClick={()=>setExpanded(prev=>({...prev,[client]:!prev[client]}))}>
                      <I name={expanded[client]?'ChevD':'ChevR'} size={11} style={{marginRight:'2px',flexShrink:0}}/>
                      <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{client}</span>
                      <span className="cg-actions">
                        <button className="cg-act-btn" title="New project in this group" onClick={function(e){e.stopPropagation();addProject(client);}}><I name="Plus" size={11}/></button>
                        <button className="cg-act-btn" title="Move up" onClick={function(e){moveClient(e,client,-1);}}><I name="ChevU" size={11}/></button>
                        <button className="cg-act-btn" title="Move down" onClick={function(e){moveClient(e,client,1);}}><I name="ChevD" size={11}/></button>
                        {client!=='General'&&<button className="cg-act-btn cg-del" title="Delete client group" onClick={function(e){deleteClient(e,client);}}><I name="Trash" size={11}/></button>}
                      </span>
                    </div>
                    {expanded[client]&&cp.map(p=>(
                      <SidebarItem key={p.id} item={p} icon="🗂" isSelected={selProj===p.id} isEditing={editingId===p.id} editValue={editVal}
                        onEditChange={setEditVal} onSelect={(e,id)=>selectProject(id)} onEditStart={startEdit}
                        onEditSave={id=>saveEdit(id,'project')} onEditKeyDown={(e,id)=>editKeyDown(e,id,'project')} onDelete={delProject}
                        onContextMenu={openProjectMenu}/>
                    ))}
                  </div>
                );
              })}
            </div>
            <div className="resizer" onMouseDown={e=>startPanelResize(e,'projects')}/>
          </div>
        )}

        {/* Notebooks panel */}
        {!zenMode&&(!isMobile||mobileView==='notebooks')&&(
          <div className="panel" style={{width:panelW.notebooks}}>
            <div className="panel-header">
              {isMobile&&<button className="rail-btn" style={{width:'auto',marginRight:'4px'}} onClick={()=>setMobileView('projects')}><I name="ChevL" size={14}/></button>}
              Notebooks
            </div>
            <div className="panel-body scr">
              {(activeProject?.children||[]).map(n=>(
                <SidebarItem key={n.id} item={n} icon="📓" isSelected={selNote===n.id} isEditing={editingId===n.id} editValue={editVal}
                  onEditChange={setEditVal} onSelect={(e,id)=>selectNotebook(id)} onEditStart={startEdit}
                  onEditSave={id=>saveEdit(id,'notebook')} onEditKeyDown={(e,id)=>editKeyDown(e,id,'notebook')} onDelete={delNotebook}/>
              ))}
              <div style={{padding:'6px 6px 0'}}>
                <button className="btn btn-ghost btn-sm" style={{width:'100%',justifyContent:'center'}} onClick={addNotebook} disabled={!activeProject}><I name="Plus" size={13}/> New Notebook</button>
              </div>
            </div>
            <div className="resizer" onMouseDown={e=>startPanelResize(e,'notebooks')}/>
          </div>
        )}

        {/* Pages panel */}
        {!zenMode&&(!isMobile||mobileView==='pages')&&(
          <div className="panel" style={{width:panelW.pages}}>
            <div className="panel-header">
              {isMobile&&<button className="rail-btn" style={{width:'auto',marginRight:'4px'}} onClick={()=>setMobileView('notebooks')}><I name="ChevL" size={14}/></button>}
              Pages
            </div>
            <div className="panel-body scr">
              {(activeNotebook?.children||[]).map(pg=>(
                <SidebarItem key={pg.id} item={pg} icon="📄" isSelected={selPage===pg.id} isEditing={editingId===pg.id} editValue={editVal}
                  depth={pg.level||0} onEditChange={setEditVal} onSelect={(e,id)=>selectPage(id,e)} onEditStart={startEdit}
                  onEditSave={id=>saveEdit(id,'page')} onEditKeyDown={(e,id)=>editKeyDown(e,id,'page')} onDelete={delPage}
                  onIndent={indentPage} onOutdent={outdentPage}/>
              ))}
              <div style={{padding:'6px',display:'flex',gap:'4px',flexWrap:'wrap'}}>
                <button className="btn btn-ghost btn-sm" style={{flex:1,justifyContent:'center'}} onClick={addPage} disabled={!activeNotebook}><I name="Plus" size={13}/> Page</button>
                <button className="btn btn-ghost btn-sm" title="From Template" onClick={()=>setModal('templates')} disabled={!activeNotebook}><I name="Layout" size={13}/></button>
                <button className="btn btn-ghost btn-sm" title="Upload PDF" style={{color:'#ef4444'}} onClick={()=>pdfRef.current?.click()} disabled={!activeNotebook}>PDF</button>
                <input ref={pdfRef} type="file" accept=".pdf" hidden onChange={handlePdfUpload}/>
              </div>
            </div>
            <div className="resizer" onMouseDown={e=>startPanelResize(e,'pages')}/>
          </div>
        )}

        {/* Editor area */}
        <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minWidth:0}} className={isMobile&&mobileView!=='editor'?'hidden':''}>
          {/* Header */}
          <div className="main-header no-print">
            <div className="breadcrumb">
              {isMobile&&<button className="rail-btn" style={{width:'auto',marginRight:'4px'}} onClick={()=>setMobileView('pages')}><I name="ChevL" size={14}/></button>}
              {breadcrumbs.map((item,i)=>(
                <React.Fragment key={i}>
                  {i>0&&<span style={{color:'var(--text-3)',margin:'0 2px'}}>›</span>}
                  <span className={'breadcrumb-item'+(item.current?' current':'')}>{item.label}</span>
                </React.Fragment>
              ))}
              {!activePage&&activeProject&&<span style={{color:'var(--accent-2)',fontSize:'12px'}}>Dashboard</span>}
            </div>
            <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
              {activePage&&<button className="btn btn-ghost btn-sm" onClick={saveTemplate}><I name="Layout" size={13}/> Save as Template</button>}
              {activePage&&<button className="btn btn-ghost btn-sm" onClick={()=>window.print()}><I name="Print" size={13}/></button>}
              <button className={'btn btn-sm'+(aiOpen?' btn-primary':' btn-ghost')} onClick={()=>setAiOpen(o=>!o)}>
                <I name="Sparkles" size={13}/> AI
              </button>
            </div>
          </div>

          {/* Toolbar */}
          {activePage&&(
            <EditorToolbar
              engine={activePane==='primary'?engineRef.current:engine2Ref.current}
              activePage={activePage} onUpdatePage={updatePageProp} onInsertEngBlock={insertEngBlock}/>
          )}

          {/* Editor panes */}
          <div style={{flex:1,display:'flex',overflow:'hidden'}}>
            <div style={{flex:splitMode?'0 0 '+splitRatio+'%':1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
              {activePage
                ?renderEditorPane(activePage,'primary',engineRef,activePane==='primary')
                :activeNotebook
                  ?<NotebookDashboard notebook={activeNotebook} onUpdate={updateNotebookMeta}/>
                  :activeProject
                    ?<ProjectRollup project={activeProject} onSelectNotebook={selectNotebook}/>
                  :<div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:'16px',color:'var(--text-3)',background:'var(--panel-bg)'}}>
                    <div style={{width:'52px',height:'52px',background:'var(--accent)',borderRadius:'14px',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'IBM Plex Mono',fontWeight:600,fontSize:'15px',color:'white',opacity:0.25}}>LC</div>
                    <span style={{fontSize:'13px'}}>Select a project to get started</span>
                    <button className="btn btn-ghost btn-sm" onClick={function(){addProject('General');}}><I name="Plus" size={13}/> New Project in General</button>
                  </div>
              }
            </div>
            {splitMode&&(
              <>
                <div className="split-resizer" onMouseDown={startSplitResize}/>
                <div style={{flex:'0 0 '+(100-splitRatio)+'%',display:'flex',flexDirection:'column',overflow:'hidden',borderLeft:'1px solid var(--border)'}}>
                  {renderEditorPane(secondaryPage,'secondary',engine2Ref,activePane==='secondary')}
                </div>
              </>
            )}
          </div>
        </div>

        {/* AI Panel */}
        {aiOpen&&(
          <AIPanel projects={projects} selectedProjId={selProj} selectedNoteId={selNote} selectedPageId={selPage}
            settings={settings} onClose={()=>setAiOpen(false)} width={aiWidth} onResizeStart={startAIResize}/>
        )}
      </div>

      {/* Modals */}
      {modal==='search'&&<SearchOverlay projects={projects} onClose={()=>setModal(null)} onSelect={function(r){setSelProj(r.projId);setSelNote(r.notebookId);setSelPage(r.id);setActivePane('primary');setMobileView('editor');setModal(null);}}/>}
      {modal==='settings'&&<SettingsModal settings={settings} projects={projects} onStageImport={handleStageImport} onClose={()=>setModal(null)} onSave={s=>{setSettings(s);idb.putSetting('appSettings',s);try{localStorage.setItem('neuronote_settings',JSON.stringify(s));}catch(e){}}}/>}
      {importStage&&<ImportDestinationModal mode={importStage.mode} payload={importStage.payload} projects={projects} onConfirm={handleImportConfirm} onClose={()=>setImportStage(null)}/>}
      {ctxMenu&&<ProjectContextMenu x={ctxMenu.x} y={ctxMenu.y} project={ctxMenu.project} clients={clients} onMove={moveProjectToClient} onClose={()=>setCtxMenu(null)}/>}
      {modal==='diag'&&<DiagnosticsModal projects={projects} syncStatus={syncStatus} onClose={()=>setModal(null)} selProj={selProj} selNote={selNote} selPage={selPage}/>}
      {modal==='templates'&&<TemplateModal templates={templates} onLoad={loadTemplate} onDelete={delTemplate} onClose={()=>setModal(null)}/>}
    </div>
  );
}

// ── Debug overlay (remove after confirming navigation works) ──────────────
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
